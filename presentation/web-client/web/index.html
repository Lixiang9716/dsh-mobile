<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSH Web Client</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; font: 15px/1.45 -apple-system, system-ui, sans-serif;
    background: #0b0e14; color: #dbe2ee; display: flex; flex-direction: column;
    height: 100dvh;
  }
  header {
    padding: 10px 14px; font-size: 13px; color: #8b96a8;
    border-bottom: 1px solid #1d2430; display: flex; gap: 8px; align-items: center;
  }
  #dot { width: 9px; height: 9px; border-radius: 50%; background: #b3413c; }
  #dot.on { background: #3f9d63; }
  #toolbar { display: flex; gap: 6px; margin-left: auto; }
  #toolbar button {
    font: inherit; font-size: 11px; background: #1d2430; color: #dbe2ee;
    border: 1px solid #3d485b; border-radius: 4px; padding: 2px 8px;
  }
  #stream {
    flex: 1; overflow-y: auto; padding: 14px; white-space: pre-wrap;
    word-break: break-word;
  }
  .msg { margin-bottom: 12px; }
  .role { font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
          color: #6f7b8f; margin-bottom: 3px; }
  .tool { color: #d9a54a; font-size: 13px; margin: 4px 0; }
  .sys  { color: #5f6b7e; font-size: 12px; margin: 2px 0; }
</style>
</head>
<body>
<header><span id="dot"></span><span id="status">connecting…</span><span id="toolbar"></span></header>
<main id="stream"></main>
<script src="./main.js"></script>
</body>
</html>
