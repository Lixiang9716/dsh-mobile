<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DSH 鲸鱼客户端</title>
<link rel="stylesheet" href="./whale.css">
</head>
<body>
  <div id="ocean" aria-hidden="true">
    <div class="rays"></div>
    <div class="bubbles" id="bubbles"></div>

    <!-- The swimming blue whale: body + flukes + fin + eye, one SVG so the
         whole creature animates as a unit while the parts oscillate. -->
    <div id="whale-flip">
    <svg id="whale" viewBox="0 0 420 200" role="img" aria-label="游动的蓝色鲸鱼">
      <g id="whale-body">
        <path id="flukes" d="M348 96
          C 372 74, 392 62, 414 58
          C 402 84, 402 104, 414 130
          C 392 128, 372 118, 348 98 Z"/>
        <path d="M20 100
          C 30 58, 90 30, 170 32
          C 250 34, 320 62, 352 94
          C 356 98, 356 100, 352 104
          C 320 136, 250 162, 170 164
          C 90 166, 30 140, 20 100 Z"/>
        <path id="belly" d="M40 122
          C 90 150, 240 152, 330 108
          C 300 148, 220 168, 160 166
          C 110 164, 60 146, 40 122 Z"/>
        <path id="fin" d="M120 128
          C 132 148, 156 158, 178 156
          C 160 168, 132 166, 114 150 Z"/>
        <circle id="eye" cx="72" cy="84" r="5"/>
        <path id="spout" d="M64 30
          C 58 16, 48 8, 34 4 M64 30
          C 66 14, 76 4, 92 0 M64 30
          C 64 12, 64 6, 64 0"/>
      </g>
    </svg>
    </div>

    <div class="surface"></div>
  </div>

  <header>
    <span id="dot"></span><span id="status">connecting…</span>
    <span id="whale-label">🐳 DSH 鲸鱼客户端</span>
    <span id="toolbar"></span>
  </header>

  <main id="stream"></main>
  <script src="./main.js"></script>
</body>
</html>
