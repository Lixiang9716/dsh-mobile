# DSHSpike — minimal iOS host embedding the M1 core spike.
#
# The committed DSHSpike.xcodeproj is generated from this file
# (hosts/ios/gen.sh) but is ALSO committed, so CI and fresh clones build
# without xcodegen. The pre-build phase re-runs Tools/gen_bundle_header.py
# whenever a runtime/spike JS input changes, keeping the embedded bundle
# byte-identical to the checkout. quickjs-ng sources come from
# runtime/spike/vendor/quickjs-ng/0.17.0 — materialize them first with
# runtime/spike/vendor/ensure.sh.
name: DSHSpike
options:
  bundleIdPrefix: org.dsh
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    HEADER_SEARCH_PATHS:
      - "$(SRCROOT)/../../runtime/spike/host"
      - "$(SRCROOT)/../../runtime/spike/vendor/quickjs-ng/0.17.0"
      # The wasm3 interpreter's own headers (dsh_wasm.c includes them by
      # quoted name from a different directory than the vendored sources).
      - "$(SRCROOT)/../../runtime/spike/vendor/wasm3/0.9.0/source"
      # zstd headers (dsh_spike_host.c intrinsics include them)
      - "$(SRCROOT)/../../runtime/spike/vendor/zstd/1.5.7"
      - "$(SRCROOT)/../../runtime/spike/vendor/zstd/1.5.7/common"
      - "$(SRCROOT)/App/Generated"
    # zstd's x86_64 fast loop lives in huf_decompress_amd64.S, which the pin
    # does not carry: an x86_64 slice (Intel-Mac simulator) would hit undefined
    # HUF_*_fast_asm_loop symbols at link. ZSTD_DISABLE_ASM is zstd's own
    # switch — same define the android/harmony CMake and the CLI build pass.
    # Expressed per-config so the Debug default (DEBUG=1) survives intact.
    configs:
      Debug:
        GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "DEBUG=1", "ZSTD_DISABLE_ASM=1"]
      Release:
        GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "ZSTD_DISABLE_ASM=1"]

targets:
  DSHSpike:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: ../../runtime/spike/host/dsh_spike_host.c
      - path: ../../runtime/spike/vendor/quickjs-ng/0.17.0/dtoa.c
      - path: ../../runtime/spike/vendor/quickjs-ng/0.17.0/libregexp.c
      - path: ../../runtime/spike/vendor/quickjs-ng/0.17.0/libunicode.c
      - path: ../../runtime/spike/vendor/quickjs-ng/0.17.0/quickjs.c
      # The WebAssembly interpreter (contract v1.2.0 `wasmRun`): vendored +
      # sha256-pinned by runtime/spike/vendor/ensure-wasm3.sh, compiled from
      # the same vendor tree the quickjs sources come from. Only the core is
      # linked; the WASI backends stay out (the app's boundary is our own
      # imported functions, not WASI's descriptor table).
      - path: ../../runtime/spike/vendor/wasm3/0.9.0/source/m3_core.c
      # zstd 1.5.7 (BSD-3, single-thread) — the node:zlib zstd face, pinned by
      # runtime/spike/vendor/ensure-zstd.sh
      - path: ../../runtime/spike/vendor/zstd/1.5.7/common/debug.c
      - path: ../../runtime/spike/vendor/zstd/1.5.7/common/entropy_common.c
      - path: ../../runtime/spike/vendor/zstd/1.5.7/common/error_private.c
      - path: ../../runtime/spike/vendor/zstd/1.5.7/common/fse_decompress.c
      - path: ../../runtime/spike/vendor/zstd/1.5.7/common/pool.c
      - path: ../../runtime/spike/vendor/zstd/1.5.7/common/threading.c
      - path: ../../runtime/spike/vendor/zstd/1.5.7/common/xxhash.c
      - path: ../../runtime/spike/vendor/zstd/1.5.7/common/zstd_common.c
      - path: ../../runtime/spike/vendor/zstd/1.5.7/compress/fse_compress.c
      - path: ../../runtime/spike/vendor/zstd/1.5.7/compress/hist.c
      - path: ../../runtime/spike/vendor/zstd/1.5.7/compress/huf_compress.c
      - path: ../../runtime/spike/vendor/zstd/1.5.7/compress/zstd_compress.c
      - path: ../../runtime/spike/vendor/zstd/1.5.7/compress/zstd_compress_literals.c
      - path: ../../runtime/spike/vendor/zstd/1.5.7/compress/zstd_compress_sequences.c
      - path: ../../runtime/spike/vendor/zstd/1.5.7/compress/zstd_compress_superblock.c
      - path: ../../runtime/spike/vendor/zstd/1.5.7/compress/zstd_double_fast.c
      - path: ../../runtime/spike/vendor/zstd/1.5.7/compress/zstd_fast.c
      - path: ../../runtime/spike/vendor/zstd/1.5.7/compress/zstd_lazy.c
      - path: ../../runtime/spike/vendor/zstd/1.5.7/compress/zstd_ldm.c
      - path: ../../runtime/spike/vendor/zstd/1.5.7/compress/zstd_opt.c
      - path: ../../runtime/spike/vendor/zstd/1.5.7/compress/zstd_preSplit.c
      - path: ../../runtime/spike/vendor/zstd/1.5.7/decompress/huf_decompress.c
      - path: ../../runtime/spike/vendor/zstd/1.5.7/decompress/zstd_ddict.c
      - path: ../../runtime/spike/vendor/zstd/1.5.7/decompress/zstd_decompress.c
      - path: ../../runtime/spike/vendor/zstd/1.5.7/decompress/zstd_decompress_block.c
      - path: ../../runtime/spike/vendor/wasm3/0.9.0/source/m3_env.c
      - path: ../../runtime/spike/vendor/wasm3/0.9.0/source/m3_parse.c
      - path: ../../runtime/spike/vendor/wasm3/0.9.0/source/m3_compile.c
      - path: ../../runtime/spike/vendor/wasm3/0.9.0/source/m3_code.c
      - path: ../../runtime/spike/vendor/wasm3/0.9.0/source/m3_module.c
      - path: ../../runtime/spike/vendor/wasm3/0.9.0/source/m3_function.c
      - path: ../../runtime/spike/vendor/wasm3/0.9.0/source/m3_bind.c
      - path: ../../runtime/spike/vendor/wasm3/0.9.0/source/m3_info.c
      - path: ../../runtime/spike/vendor/wasm3/0.9.0/source/m3_exec.c
      - path: ../../runtime/spike/vendor/wasm3/0.9.0/source/m3_validate.c
      - path: ../../runtime/spike/host/dsh_wasm.c
    preBuildScripts:
      - name: GenerateSpikeBundle
        script: |
          python3 "$SRCROOT/Tools/gen_bundle_header.py"
        inputFiles:
          - Tools/gen_bundle_header.py
          - ../../runtime/spike/logger.js
          - ../../runtime/spike/gateway.js
          - ../../runtime/spike/registry.js
          - ../../runtime/spike/manifest.json
          - ../../runtime/spike/scenario/boot-verification.js
          - ../../runtime/spike/scenario/gateway-binding.js
          - ../../runtime/spike/scenario/gateway-bridge-smoke.js
          - ../../runtime/spike/scenario/session-mock-llm.js
          - ../../runtime/spike/scenario/carrier-loopback.js
          - ../../runtime/spike/scenario/session-web-live.js
          - ../../runtime/spike/upstream/web-write.js
          - ../../runtime/spike/upstream/web-write-streams.js
          - ../../runtime/spike/upstream/web-write-settings.js
          - ../../runtime/spike/scenario/composer-web-live.js
          - ../../runtime/spike/web/index.html
          - ../../runtime/spike/web/carrier-page.js
          - ../../runtime/spike/llm.js
          - ../../runtime/spike/scenario/llm-live-stream.js
          - ../../runtime/spike/vendor/dsh/util-crypto@0.1.6-alpha.2/lib/index.js
          - ../../system-plugins/dsh-fs/manifest.json
          - ../../system-plugins/dsh-fs/index.js
          - ../../system-plugins/dsh-subprocess-quickjs/manifest.json
          - ../../system-plugins/dsh-subprocess-quickjs/index.js
          - ../../system-plugins/dsh-ui/manifest.json
          - ../../system-plugins/dsh-ui/index.js
          - ../../system-plugins/dsh-shell-ish/manifest.json
          - ../../system-plugins/dsh-shell-ish/index.js
          - ../../presentation/web-client/manifest.json
          - ../../presentation/web-client/web/index.html
          - ../../presentation/web-client/web/main.js
        outputFiles:
          - App/Generated/SpikeBundle.h
          - App/Generated/SpikeBundle.c
      # The guest USERLAND, as a tarball. The extracted tree cannot ride in an
      # app bundle — the Alpine userland carries 335 symlinks, most of them
      # absolute (`/usr/bin/top -> /bin/busybox`), and installd refuses the app
      # outright (`invalid symlink at …`). A `.tar.gz` is a plain data file, so
      # the pinned minirootfs ships here and the app materializes it into its
      # container at first launch (`dsh_ish_stage`, gzip via zlib). `App` is
      # already a source path, so the file XcodeGen finds under App/Generated is
      # copied into the bundle as a resource; the script's own pin + sha256 is
      # the provenance record (the tarball itself is untracked).
      - name: FetchIshRootfs
        basedOnDependencyAnalysis: false
        script: |
          "$SRCROOT/../../runtime/spike/vendor/ensure-ish-rootfs.sh" "$SRCROOT/App/Generated"
        inputFiles:
          - ../../runtime/spike/vendor/ensure-ish-rootfs.sh
        outputFiles:
          - App/Generated/ish-rootfs.tar.gz
      # The in-process Linux guest (contract v1.3.0 `ishRun`): the vendored
      # iSH-arm64 engine is built by the SAME CMake file the macOS CLI uses,
      # configured here for this SDK and architecture, and the app links the
      # two static libraries it produces — Xcode compiles no engine source
      # itself. `basedOnDependencyAnalysis: false` is what this phase means: the
      # engine's input set is the vendor tree plus the CMake file, and CMake is
      # the thing that knows what is out of date (the same reason, and the same
      # warning, as StageOfficialWeb below).
      - name: BuildIshEngine
        basedOnDependencyAnalysis: false
        script: |
          # Xcode's build environment carries the system paths only, so a
          # Homebrew cmake has to be found by hand (and named loudly when absent
          # — the engine cannot be built without it).
          if ! command -v cmake >/dev/null 2>&1; then
            for dir in /opt/homebrew/bin /usr/local/bin; do
              [ -x "$dir/cmake" ] && PATH="$dir:$PATH"
            done
          fi
          command -v cmake >/dev/null 2>&1 || {
            echo "error: cmake not found — install CMake (brew install cmake)"; exit 1; }
          set -e
          REPO="$SRCROOT/../.."
          "$REPO/runtime/spike/vendor/ensure-ish.sh"
          # The guest vdso is a GUEST aarch64 elf, so it is identical on every
          # platform: a HOST configure builds it once and the iOS build reuses
          # it. The zero-byte placeholder a cross-compile would write is not an
          # option — a zeroed vdso makes the kernel ABORT the app on the first
          # signal delivered to a guest task (kernel/vdso.c's fail path), and
          # ISH_VDSO_ELF_DIR refuses it.
          VDSO="$REPO/runtime/spike/build/ish/vdso"
          if [ ! -s "$VDSO/libvdso.so.elf" ]; then
            cmake -S "$REPO/runtime/spike/host/ish" -B "$REPO/runtime/spike/build/ish"
            cmake --build "$REPO/runtime/spike/build/ish" --target ish-vdso
          fi
          BUILD="$REPO/runtime/spike/build/ish-ios-$SDK_NAME"
          cmake -S "$REPO/runtime/spike/host/ish" -B "$BUILD" \
            -DISH_SDK="$SDK_NAME" \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="$SDK_NAME" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$IPHONEOS_DEPLOYMENT_TARGET" \
            -DISH_VDSO_ELF_DIR="$VDSO"
          cmake --build "$BUILD" --target dsh_ish
      # This phase was previously only in the COMMITTED pbxproj, not here — so
      # `gen.sh` would have silently dropped it, and a regenerated project would
      # have shipped a Release build with no embedded official web client (the
      # release workflow's dist assertion catches that downstream, but only
      # after a failing build). Declaring it here makes the generator the single
      # source for it, and `basedOnDependencyAnalysis: false` states what the
      # phase already does — run every build — which is also what silences
      # Xcode's "will be run during every build because it does not specify any
      # outputs" warning. It must run every build: it fails loud on a missing
      # Release tree or a copied byte that drifts, which only holds if it runs.
      - name: StageOfficialWeb
        basedOnDependencyAnalysis: false
        script: |
          # Release only: embed the vendored official Web Client (dist + client
          # bundles) so a plain launch reaches the official UI with nothing
          # staged from outside. Debug is a no-op (the harness stages Documents
          # itself, and the E2E evidence must keep reading exactly the tree it
          # stages). The script fails loud when a Release source tree is missing
          # or a copied byte drifts.
          set -e
          python3 "$SRCROOT/Tools/stage_official_web.py" "$CONFIGURATION" \
            "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: DSH Spike
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # The picker E2E grants a scope into the app's Documents directory;
        # both flags keep that directory visible/browsable in Files.app so
        # the granted files can be inspected from the simulator UI.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.dsh.DSHSpike
        SWIFT_OBJC_BRIDGING_HEADER: App/Source/Bridge.h
        TARGETED_DEVICE_FAMILY: "1"
        # The in-process Linux guest is an aarch64 HOST engine — its interpreter
        # gadgets are hand-written aarch64 assembly and its guest is aarch64 —
        # so an x86_64 simulator slice cannot exist. Without this exclusion a
        # generic simulator build compiles both archs and the x86_64 link fails
        # on the engine's symbols (an `-destination` naming one simulator still
        # builds a single arch, which is why CI never sees it).
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        # The engine's static libraries (BuildIshEngine above, one build dir per
        # SDK) and the sqlite3 the guest's fake filesystem metadata uses — a
        # system library on iOS, hence no path for it.
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../../runtime/spike/build/ish-ios-$(SDK_NAME)"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-ldsh_ish"
          - "-lishcore"
          - "-lsqlite3"
          # zlib and libresolv are the seam's own dependencies, not the
          # engine's: dsh_ish_stage() inflates the pinned guest userland tarball
          # with zlib and seeds the guest's /etc/resolv.conf from the HOST's
          # resolvers with res_ninit (Darwin's res_9_ninit lives in libresolv).
          # A static library does not carry its dependencies, so the consumer
          # names them — build.sh does the same for the desktop CLI.
          - "-lz"
          - "-lresolv"
      # The Release log-strip flag (AGENTS.md constraint 5 / rules.md rule L4).
      # It lived ONLY in the committed pbxproj, so regenerating the project
      # silently dropped it and the strip became cosmetic — a release build with
      # full logging. `dev/ios` builds Debug and cannot see that; the `logging`
      # gate's L4c reads the pbxproj and caught it on the regeneration.
      configs:
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DSH_RELEASE
