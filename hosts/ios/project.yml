# DSHSpike — minimal iOS host embedding the M1 core spike.
#
# The committed DSHSpike.xcodeproj is generated from this file
# (hosts/ios/gen.sh) but is ALSO committed, so CI and fresh clones build
# without xcodegen. The pre-build phase re-runs Tools/gen_bundle_header.py
# whenever a runtime/spike JS input changes, keeping the embedded bundle
# byte-identical to the checkout. quickjs-ng sources come from
# runtime/spike/vendor/quickjs-ng/0.17.0 — materialize them first with
# runtime/spike/vendor/ensure.sh.
name: DSHSpike
options:
  bundleIdPrefix: org.dsh
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    HEADER_SEARCH_PATHS:
      - "$(SRCROOT)/../../runtime/spike/host"
      - "$(SRCROOT)/../../runtime/spike/vendor/quickjs-ng/0.17.0"
      - "$(SRCROOT)/App/Generated"

targets:
  DSHSpike:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: ../../runtime/spike/host/dsh_spike_host.c
      - path: ../../runtime/spike/vendor/quickjs-ng/0.17.0/dtoa.c
      - path: ../../runtime/spike/vendor/quickjs-ng/0.17.0/libregexp.c
      - path: ../../runtime/spike/vendor/quickjs-ng/0.17.0/libunicode.c
      - path: ../../runtime/spike/vendor/quickjs-ng/0.17.0/quickjs.c
    preBuildScripts:
      - name: GenerateSpikeBundle
        script: |
          python3 "$SRCROOT/Tools/gen_bundle_header.py"
        inputFiles:
          - Tools/gen_bundle_header.py
          - ../../runtime/spike/logger.js
          - ../../runtime/spike/scenario/m1-spike-boot.js
          - ../../runtime/spike/vendor/dsh/util-crypto@0.1.6-alpha.1/lib/index.js
        outputFiles:
          - App/Generated/SpikeBundle.h
          - App/Generated/SpikeBundle.c
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: DSH Spike
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.dsh.DSHSpike
        SWIFT_OBJC_BRIDGING_HEADER: App/Source/Bridge.h
        TARGETED_DEVICE_FAMILY: "1"
