			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# Xcode's build environment carries the system paths only, so a\n# Homebrew cmake has to be found by hand (and named loudly when absent\n# — the engine cannot be built without it).\nif ! command -v cmake >/dev/null 2>&1; then\n  for dir in /opt/homebrew/bin /usr/local/bin; do\n    [ -x \"$dir/cmake\" ] && PATH=\"$dir:$PATH\"\n  done\nfi\ncommand -v cmake >/dev/null 2>&1 || {\n  echo \"error: cmake not found — install CMake (brew install cmake)\"; exit 1; }\nset -e\nREPO=\"$SRCROOT/../..\"\n\"$REPO/runtime/spike/vendor/ensure-ish.sh\"\n# The guest vdso is a GUEST aarch64 elf, so it is identical on every\n# platform: a HOST configure builds it once and the iOS build reuses\n# it. The zero-byte placeholder a cross-compile would write is not an\n# option — a zeroed vdso makes the kernel ABORT the app on the first\n# signal delivered to a guest task (kernel/vdso.c's fail path), and\n# ISH_VDSO_ELF_DIR refuses it.\nVDSO=\"$REPO/runtime/spike/build/ish/vdso\"\nif [ ! -s \"$VDSO/libvdso.so.elf\" ]; then\n  cmake -S \"$REPO/runtime/spike/host/ish\" -B \"$REPO/runtime/spike/build/ish\"\n  cmake --build \"$REPO/runtime/spike/build/ish\" --target ish-vdso\nfi\nBUILD=\"$REPO/runtime/spike/build/ish-ios-$SDK_NAME\"\ncmake -S \"$REPO/runtime/spike/host/ish\" -B \"$BUILD\" \\\n  -DISH_SDK=\"$SDK_NAME\" \\\n  -DCMAKE_SYSTEM_NAME=iOS \\\n  -DCMAKE_OSX_SYSROOT=\"$SDK_NAME\" \\\n  -DCMAKE_OSX_ARCHITECTURES=arm64 \\\n  -DCMAKE_OSX_DEPLOYMENT_TARGET=\"$IPHONEOS_DEPLOYMENT_TARGET\" \\\n  -DISH_VDSO_ELF_DIR=\"$VDSO\"\ncmake --build \"$BUILD\" --target dsh_ish\n";
		};
