name: release/packages
# Manual release packaging: one dispatch builds the three host apps and
# uploads each as its own artifact (docs/release.md is the user guide).
#
# DEFAULT DISPATCH — the USER-FACING builds. A distribution build is what a
# user gets: no E2E machinery, no per-event log stream, warn/error only
# (AGENTS.md constraint 5 / rules.md rule L4):
#   dsh-ios      — unsigned Release device .app (sign locally) + Release
#                  simulator .app; the official Web Client is EMBEDDED
#   dsh-android  — Release APK (unsigned; sign to install), official web app
#                  packed in assets
#   dsh-harmony  — unsigned Release HAP
#
# `include_harness: true` additionally builds the HARNESS artifacts — the E2E
# verification vehicles (debug configuration, full structured logging, the
# verification drives run). They exist for hand-testing on physical devices;
# the dev/* pipelines already build and run the debug harness on every push,
# so this is opt-in:
#   dsh-ios-harness      — unsigned Debug device .app + Debug simulator .app
#   dsh-android-harness  — debug APK (debug-keystore signed; installs directly)
#   dsh-harmony-harness  — unsigned debug HAP
#
# One job per platform, both configurations inside it: the expensive
# vendoring/materialization steps are shared, and the macOS runner (billed at
# a premium) is not paid for twice. Build commands mirror the dev/* pipelines
# (they are the proven recipes); every build step runs under `set -o pipefail`
# so a piped tail can never mask a red xcodebuild/gradle/hvigor exit code.
# TWO TRIGGERS, one build path:
#
#   release: published  — release-please cut a release. The three USER-FACING
#                         packages build and are ATTACHED as assets of that
#                         GitHub Release, so a tag is a downloadable build set
#                         and not just a diff.
#   workflow_dispatch   — manual packaging, when a human asks for a run that
#                         is not tied to a release. Artifacts land on the run.
#
# A release run never builds the harness packages: they are verification
# vehicles (above), and the `inputs` context is empty outside a dispatch, so
# the harness steps are guarded explicitly rather than by that accident.

on:
  workflow_dispatch:
    inputs:
      include_harness:
        description: >-
          Also build the E2E harness packages (debug configuration, full
          logs, verification drives). Off by default — the dev/* pipelines
          cover the debug harness on every push.
        type: boolean
        default: false
      release_tag:
        description: >-
          Attach the built packages to this existing release tag (e.g. v0.0.1),
          REPLACING that tag's assets in place — the recovery path for a
          release whose asset was built wrong, without deleting and
          re-publishing the release. Leave empty for a plain manual run, whose
          packages stay on the workflow run only.
        type: string
        required: false
        default: ''
  release:
    types: [published]

# `gh release upload` writes assets onto the published release.
permissions:
  contents: write

jobs:
  ios-package:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # Empty on a plain dispatch (packages stay on the run); the release tag
      # otherwise — the event's own tag, or the one a dispatch asked for.
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Vendor quickjs-ng + the pinned upstream DSH closure
        # Both trees are untracked by design (upstream discipline D6);
        # gen_bundle_header.py pins the alpha.2 dsh closure at build time.
        run: |
          set -euo pipefail
          sh runtime/spike/vendor/ensure.sh
          sh runtime/spike/vendor/ensure-dsh.sh

      - name: Materialize the official Web Client the release build embeds
        # The RELEASE configuration EMBEDS the official dist + client bundles
        # as app resources (Tools/stage_official_web.py, run from the
        # StageOfficialWeb build phase) so a plain launch reaches the official
        # UI with nothing staged from outside. Same reproducible rebuild the
        # Android job runs.
        env:
          COREPACK_INTEGRITY_KEYS: '0'
          NODE_OPTIONS: '--max-old-space-size=3072'
        run: |
          set -euo pipefail
          corepack enable
          tools/e2e/ensure-official-dist.sh
          tools/e2e/ensure-client-bundles.sh

      - name: Build the release .app (device + simulator, unsigned)
        run: |
          set -o pipefail
          cd hosts/ios
          xcodebuild build \
            -project DSHSpike.xcodeproj \
            -scheme DSHSpike \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath /tmp/dsh-rel-device-dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            | tail -20
          xcodebuild build \
            -project DSHSpike.xcodeproj \
            -scheme DSHSpike \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/dsh-rel-sim-dd \
            | tail -20
          test -f /tmp/dsh-rel-device-dd/Build/Products/Release-iphoneos/DSHSpike.app/official-web/dist/index.html \
            || { echo "::error::the release .app embeds no official dist"; exit 1; }
          # The device build is packaged as a real `.ipa`: a zip whose root
          # holds Payload/<App>.app. That layout is what AltStore, Sideloadly
          # and `xcrun devicectl` expect, and it is the only thing the `.ipa`
          # extension can honestly mean — handing out a zip rooted at
          # `Release-iphoneos/…` under that name would be a name no iOS tool
          # agrees with. It is UNSIGNED (CI holds no Apple certificates):
          # the signer replaces the profile and re-seals it.
          rm -rf /tmp/dsh-ipa && mkdir -p /tmp/dsh-ipa/Payload
          cp -R /tmp/dsh-rel-device-dd/Build/Products/Release-iphoneos/DSHSpike.app \
            /tmp/dsh-ipa/Payload/
          ( cd /tmp/dsh-ipa && zip -qry /tmp/dsh-ios.ipa Payload )
          unzip -l /tmp/dsh-ios.ipa | grep -q 'Payload/DSHSpike.app/' \
            || { echo "::error::the .ipa does not carry Payload/DSHSpike.app"; exit 1; }
          cd /tmp/dsh-rel-sim-dd/Build/Products
          zip -qry /tmp/dsh-ios-simulator.zip Release-iphonesimulator/DSHSpike.app

      - name: Upload dsh-ios
        uses: actions/upload-artifact@v4
        with:
          name: dsh-ios
          path: |
            /tmp/dsh-ios.ipa
            /tmp/dsh-ios-simulator.zip
          if-no-files-found: error

      - name: Attach dsh-ios to the release
        # A release asset's NAME is the uploaded file's basename. `gh release
        # upload`'s `file#text` form sets only the display LABEL, which a
        # download ignores — so both files are built under the names they ship
        # with, in the build step above.
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            /tmp/dsh-ios.ipa \
            /tmp/dsh-ios-simulator.zip \
            --clobber

      - name: Build the harness .app (debug, device + simulator, unsigned)
        if: github.event_name == 'workflow_dispatch' && inputs.include_harness
        run: |
          set -o pipefail
          cd hosts/ios
          xcodebuild build \
            -project DSHSpike.xcodeproj \
            -scheme DSHSpike \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath /tmp/dsh-harness-device-dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            | tail -20
          xcodebuild build \
            -project DSHSpike.xcodeproj \
            -scheme DSHSpike \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/dsh-harness-sim-dd \
            | tail -20
          cd /tmp/dsh-harness-device-dd/Build/Products
          zip -qry /tmp/DSHSpike-harness-device-unsigned.zip Debug-iphoneos/DSHSpike.app
          cd /tmp/dsh-harness-sim-dd/Build/Products
          zip -qry /tmp/DSHSpike-harness-simulator.zip Debug-iphonesimulator/DSHSpike.app

      - name: Upload dsh-ios-harness
        if: github.event_name == 'workflow_dispatch' && inputs.include_harness
        uses: actions/upload-artifact@v4
        with:
          name: dsh-ios-harness
          path: |
            /tmp/DSHSpike-harness-device-unsigned.zip
            /tmp/DSHSpike-harness-simulator.zip
          if-no-files-found: error

  android-package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Empty on a plain dispatch (packages stay on the run); the release tag
      # otherwise — the event's own tag, or the one a dispatch asked for.
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install the pinned NDK and CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The APK packs the vendored official web app (reproducible, manifest-
      # verified); the Gradle build fails loud without them. Same swap belt
      # as dev/android: the upstream monorepo builds die SIGKILLed under RAM
      # pressure on hosted runners.
      - name: Add swap for the upstream builds
        run: |
          sudo fallocate -l 6G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

      - name: Materialize the vendored web app + DSH closure
        env:
          COREPACK_INTEGRITY_KEYS: '0'
          NODE_OPTIONS: '--max-old-space-size=3072'
        run: |
          set -euo pipefail
          corepack enable
          runtime/spike/vendor/ensure-dsh.sh > /dev/null
          tools/e2e/ensure-official-dist.sh
          tools/e2e/ensure-client-bundles.sh

      - name: Build the release APK (unsigned; the defines live in app/build.gradle.kts)
        working-directory: hosts/android
        run: |
          set -euo pipefail
          ./gradlew assembleRelease --no-daemon
          test -f app/build/outputs/apk/release/app-release-unsigned.apk || {
            echo "::error::release APK not produced"; exit 1
          }
          unzip -l app/build/outputs/apk/release/app-release-unsigned.apk \
            | grep -q 'assets/official-web/dist/index.html' || {
            echo "::error::the release APK embeds no official dist"; exit 1
          }

      - name: Upload dsh-android
        uses: actions/upload-artifact@v4
        with:
          name: dsh-android
          path: hosts/android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

      - name: Attach dsh-android to the release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cp hosts/android/app/build/outputs/apk/release/app-release-unsigned.apk \
            /tmp/dsh-android.apk
          gh release upload "$RELEASE_TAG" /tmp/dsh-android.apk --clobber

      - name: Build the harness APK (debug — debug-keystore signed, installs directly)
        if: github.event_name == 'workflow_dispatch' && inputs.include_harness
        working-directory: hosts/android
        run: |
          set -euo pipefail
          ./gradlew assembleDebug --no-daemon
          test -f app/build/outputs/apk/debug/app-debug.apk || {
            echo "::error::harness APK not produced"; exit 1
          }

      - name: Upload dsh-android-harness
        if: github.event_name == 'workflow_dispatch' && inputs.include_harness
        uses: actions/upload-artifact@v4
        with:
          name: dsh-android-harness
          path: hosts/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  harmony-package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DEVECO_SDK_HOME: ${{ github.workspace }}/clt/command-line-tools/sdk
      # Empty on a plain dispatch (packages stay on the run); the release tag
      # otherwise — the event's own tag, or the one a dispatch asked for.
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache the unpacked HarmonyOS CLT
        id: clt-cache
        uses: actions/cache@v4
        with:
          path: clt
          key: hos-clt-linux-unpacked-26.0.0.821

      - name: Install HarmonyOS CLT (Linux, cache miss only)
        if: steps.clt-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          URL="${{ vars.HOS_CLT_LINUX_URL }}"
          if [ -z "$URL" ]; then
            echo "::error::Repository variable HOS_CLT_LINUX_URL is not set — cannot build the HAP (set it to the signed Linux CLT zip link from the Huawei download page)"
            exit 1
          fi
          for attempt in 1 2 3; do
            echo "download attempt $attempt..."
            curl -sS -L --retry 3 --retry-delay 5 -o /tmp/clt.zip "$URL" || true
            unzip -tq /tmp/clt.zip > /dev/null 2>&1 && break
            sleep 5
          done
          unzip -tq /tmp/clt.zip > /dev/null || { echo "::error::CLT zip corrupt/missing after retries"; exit 1; }
          unzip -q /tmp/clt.zip -d "$GITHUB_WORKSPACE/clt"
          chmod -R u+w "$GITHUB_WORKSPACE/clt"

      - name: Vendor quickjs-ng
        run: sh runtime/spike/vendor/ensure.sh

      - name: Install dependencies (ohpm) and build the release HAP (unsigned)
        working-directory: hosts/harmony
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/clt/command-line-tools/bin/ohpm" install --all
          "$GITHUB_WORKSPACE/clt/command-line-tools/bin/hvigorw" assembleHap \
            --mode module -p product=default -p buildMode=release --no-daemon
          test -f entry/build/default/outputs/default/entry-default-unsigned.hap \
            || { echo "::error::release HAP not produced"; exit 1; }
          grep -q 'DSH_RELEASE = true' \
            entry/build/default/generated/profile/default/BuildProfile.ets \
            || { echo "::error::the release HAP did not publish DSH_RELEASE"; exit 1; }

      - name: Assert the release HAP is genuinely release configuration
        # The guard above proves the LOG STRIP and says nothing about the
        # debuggable bit — which is exactly how a debuggable "release" HAP
        # shipped: a product-level `buildOption.debuggable` beat buildMode.
        # This reads the packaged metadata, where the two axes are distinct.
        working-directory: hosts/harmony
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, zipfile
          hap = "entry/build/default/outputs/default/entry-default-unsigned.hap"
          with zipfile.ZipFile(hap) as z:
              app = json.loads(z.read("module.json"))["app"]
          debug, mode = app.get("debug"), app.get("buildMode")
          if debug is not False or mode != "release":
              raise SystemExit(
                  "::error::release HAP is not release configuration "
                  f"(debug={debug!r}, buildMode={mode!r})")
          print(f"release HAP: debug={debug} buildMode={mode}")
          PY

      - name: Upload dsh-harmony
        uses: actions/upload-artifact@v4
        with:
          name: dsh-harmony
          path: hosts/harmony/entry/build/default/outputs/default/entry-default-unsigned.hap
          if-no-files-found: error

      - name: Attach dsh-harmony to the release
        # Runs BEFORE the harness build below, which overwrites this same
        # output path (both modes write entry-default-unsigned.hap).
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cp hosts/harmony/entry/build/default/outputs/default/entry-default-unsigned.hap \
            /tmp/dsh-harmony.hap
          gh release upload "$RELEASE_TAG" /tmp/dsh-harmony.hap --clobber

      - name: Build the harness HAP (debug, unsigned)
        # Same output path as the release HAP (both modes write
        # entry-default-unsigned.hap), so copy it out before anything else.
        if: github.event_name == 'workflow_dispatch' && inputs.include_harness
        working-directory: hosts/harmony
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/clt/command-line-tools/bin/hvigorw" assembleHap \
            --mode module -p product=default -p buildMode=debug --no-daemon
          test -f entry/build/default/outputs/default/entry-default-unsigned.hap \
            || { echo "::error::harness HAP not produced"; exit 1; }
          cp entry/build/default/outputs/default/entry-default-unsigned.hap \
            /tmp/entry-default-debug-unsigned.hap

      - name: Upload dsh-harmony-harness
        if: github.event_name == 'workflow_dispatch' && inputs.include_harness
        uses: actions/upload-artifact@v4
        with:
          name: dsh-harmony-harness
          path: /tmp/entry-default-debug-unsigned.hap
          if-no-files-found: error
