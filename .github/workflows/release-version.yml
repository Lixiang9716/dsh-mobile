name: release/version
# The VERSION stage of the release pipeline — the stage that PREPARES a
# release. release-please reads the conventional commits landing on main and
# keeps ONE open release PR that bumps `version.txt`, writes `CHANGELOG.md`,
# and syncs the three host version manifests (see release-please-config.json
# for the extra-file wiring).
#
# THIS STAGE DOES NOT CUT THE RELEASE (D12). `skip-github-release: true` below
# stops release-please at the pull request: it never tags and never publishes.
# Merging the release PR advances the four version files on `main`, and the
# release itself is cut by PUSHING THE TAG — `git push origin vX.Y.Z` — which
# is the trigger for the three PACKAGE stages (release/ios, release/android,
# release/harmony, one workflow per host, so the Actions list names the stage
# a run belongs to; this file used to be `release/please`, a name that named
# neither the stage nor the host).
#
# WHY THE TAG AND NOT THE BOT: a release that depends on release-please
# completing has exactly the failure mode this pipeline spent days in — the
# credential, the repository setting, the suppressed event, each one stopping
# the release at a step that reported nothing. The tag is a gesture a human
# makes deliberately and can retry, and the package workflows need only
# `contents: write`, so cutting a release no longer depends on any of the
# machinery above. What the bot keeps is the mechanical half it is good at:
# computing the version and writing the changelog, reviewed in a PR like any
# other change. `tools/release/check-tag-version.sh` runs in the package
# workflows and refuses a tag that disagrees with the version files, so the
# human-triggered path cannot ship a mislabelled build.
#
# WHY secrets.GITHUB_TOKEN, AND NO PAT
# This workflow used to demand a fine-grained PAT, on the reasoning that
# GITHUB_TOKEN-created events do not trigger workflows and `main` requires the
# `gates` check. The reasoning was half right and the medicine did not work:
# what actually blocked the release PR was a REPOSITORY SETTING —
# "Allow GitHub Actions to create and approve pull requests"
# (can_approve_pull_request_reviews), which must be ON. With it off, `POST
# /pulls` is refused outright with "GitHub Actions is not permitted to create
# or approve pull requests" — the failure the PAT had been masking, and one
# that names its own fix.
#
# The suppression rule is real, though, and it bites on the UPDATE path:
# measured on PR #107, the release PR's FIRST creation did start its
# `pull_request` workflows (gov plus all three platform pipelines, all green),
# while a later branch UPDATE from a `push: main` run produced a suppressed
# run (`action_required`) and no checks at all. So the check cannot be left to
# the PR event.
#
# `workflow_dispatch` is a documented EXCEPTION to the suppression, so the last
# step runs the `gov` workflow on the release branch explicitly. Its `gates`
# check lands on the same commit `main` protection asks about — a real gate run
# on the real commit, nothing bypassed and nothing fabricated through the
# Checks API. That dispatch is LOAD-BEARING, not belt-and-braces.
#
# The PAT had also become the pipeline's single point of failure: one that
# authenticates and carries `contents: write` but not `pull requests: write`
# gets release-please all the way to its final API call and dies there, leaving
# the version stream dead for days while every visible signal looked healthy
# (live case: runs 35589125560 / 35597056914). A credential this workflow does
# not need cannot be misconfigured.
#
# The trigger is `push: main` only: release-please derives every state
# transition from what already landed. `workflow_dispatch` exists for recovery
# — re-running after a failure, or after the first release PR is opened.

on:
  push:
    branches: [main]
  workflow_dispatch:

# One release PR at a time. Deliberately NOT cancel-in-progress: the action
# mutates the release branch, and cancelling it mid-write leaves that branch
# in a state the next run has to reconcile. A queued run is cheap.
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  # Only used by the last step, to dispatch the `gov` workflow at the release
  # branch. Without it the dispatch is refused and the release PR would sit
  # with an unproduced required check.
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # The stage stops at the PR (see "THIS STAGE DOES NOT CUT THE
          # RELEASE" above). Without this, release-please would also tag and
          # publish on merge — and the package workflows, which listen to the
          # tag, would then build the same release twice from two different
          # triggers.
          skip-github-release: true

      - name: Give the release PR its required gates check
        # See "WHY secrets.GITHUB_TOKEN" above: the PR this run just opened or
        # updated will never receive a `pull_request` event, so the required
        # `gates` check has to be produced by an explicit dispatch. A failed
        # dispatch fails this job — a release PR that cannot be merged is a
        # breakage to announce, not to leave sitting (rules.md rule 5).
        #
        # No wait on the dispatched run: the check on the PR IS the
        # enforcement, and waiting here would only duplicate it.
        #
        # GH_REPO, not a checkout: `gh` has to resolve the repository, the
        # action does not check anything out, and the step is one API call —
        # so pass the slug rather than pay for a full clone. (Without it this
        # step dies with "fatal: not a git repository".)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branch=$(gh pr list --state open --limit 100 --json headRefName \
            --jq '.[] | select(.headRefName | startswith("release-please--")) | .headRefName' \
            | head -1)
          if [ -z "$branch" ]; then
            echo "no open release PR — nothing to check"
            exit 0
          fi
          echo "release PR branch: $branch"
          gh workflow run gov.yml --ref "$branch"
          echo "dispatched the gov workflow on $branch"
