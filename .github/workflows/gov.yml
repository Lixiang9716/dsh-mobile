name: gov
# govrail: generated by `gov init --ci`; `gov uninstall` removes it.
on:
  push:
  pull_request:
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: note-presence's auto base walks back from HEAD
          # (upstream..HEAD, else HEAD~1) and needs the commits present.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install govrail
        # Pinned to the plane version (see .gov/manifest.json) — migrated
        # 0.29.4 → 0.35.0 deliberately: plane re-sealed, new templates adopted.
        run: pip install govrail==0.35.0
      - name: Install tree-sitter grammars
        # Same tree-sitter stack govrail 0.35 ships; gives the code-size gate
        # exact TS/JS function spans (without it the gate falls back to
        # heuristics and says so in its output).
        run: pip install "tree-sitter==0.23.*" "tree-sitter-typescript==0.23.2"
      - name: Run the gate DAG
        run: gov run
