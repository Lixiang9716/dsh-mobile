name: gov
# govrail: generated by `gov init --ci`; `gov uninstall` removes it.
on:
  push:
  pull_request:
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: note-presence's auto base walks back from HEAD
          # (upstream..HEAD, else HEAD~1) and needs the commits present.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install govrail
        # Pinned to the plane version (see .gov/manifest.json) — migrated
        # 0.29.4 → 0.35.0 deliberately: plane re-sealed, new templates adopted.
        run: pip install govrail==0.37.1
      # tree-sitter grammars need no separate install: govrail 0.35 already
      # depends on tree_sitter 0.26 + tree-sitter-typescript 0.23.2, which the
      # code-size gate reuses for exact TS/JS spans. Do NOT pip-install an
      # older tree-sitter core here — downgrading the core breaks govrail's
      # own parsers (ABI mismatch, seen in CI run 35297964574).
      - name: Run the gate DAG
        run: gov run
