name: gov
# govrail: generated by `gov init --ci`; `gov uninstall` removes it.
on:
  push:
  pull_request:
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: note-presence's auto base walks back from HEAD
          # (upstream..HEAD, else HEAD~1) and needs the commits present.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install govrail
        # Pinned to the version the governance plane was initialized with
        # (see .gov/manifest.json). An unpinned install breaks historical repos
        # when new govrail releases add mandatory mechanisms — 0.34.x's plane
        # seal refused this repo's seal-less checkout (fixed 2026-09-18).
        run: pip install govrail==0.29.4
      - name: Run the gate DAG
        run: gov run
