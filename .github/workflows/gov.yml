name: gov
# govrail: generated by `gov init --ci`; `gov uninstall` removes it.
# Single-run triggers: an unfiltered push hook runs the DAG twice per
# change (branch push + PR event). Branch coverage belongs to the PR;
# the push covers the default branch's own merges.
on:
  push:
    branches: [main]
  pull_request:
  # `workflow_dispatch` exists for the release PR. A branch or PR created with
  # GITHUB_TOKEN gets no workflow events — GitHub suppresses them — so
  # `release/please` runs this workflow explicitly on the release branch to
  # produce the required `gates` check. Manual runs are welcome elsewhere.
  workflow_dispatch:
# Superseded runs cancel: a newer push's verdict is the branch's state;
# an interleaved stale run answering late reads as a flake.
concurrency:
  group: gov-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gates:
    runs-on: ubuntu-latest
    # A hung gate dies in minutes, not in GitHub's 6-hour default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: note-presence's auto base walks back from HEAD
          # (upstream..HEAD, else HEAD~1) and needs the commits present.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install govrail
        # Pinned to the plane version (see .gov/manifest.json) — migrated
        # 0.37.1 → 0.45.0 deliberately: plane re-sealed, new templates adopted.
        run: pip install govrail==0.48.0
      - name: Cache the vendored closure
        # The closures gate byte-verifies the committed host copies against
        # the canonical runtime/spike closure; the closure's vendored source
        # trees are untracked by design (D6) and materialized by sha256-pinned
        # ensure scripts — cached the same way the platform workflows do,
        # keyed on the pin tables themselves. v5: v4 is forced onto Node 24
        # and annotates every run with a deprecation warning.
        uses: actions/cache@v5
        with:
          path: |
            runtime/spike/vendor/quickjs-ng
            runtime/spike/vendor/dsh
            runtime/spike/vendor/npm
          key: vendor-gov-${{ hashFiles('runtime/spike/vendor/ensure.sh', 'runtime/spike/vendor/ensure-dsh.sh') }}
      - name: Materialize the vendored closure
        # Idempotent with the cache above; without it the closures gate (and
        # its iOS regen leg) fail loud on absent sources instead of verifying.
        run: |
          runtime/spike/vendor/ensure.sh
          runtime/spike/vendor/ensure-dsh.sh
      - name: Materialize the harmony spike closure
        # The bundle-files gate (#57) walks hosts/harmony's rawfile/spike ON
        # DISK — its documented contract is "the vendor script materializes it
        # before any check runs" — and the pinned zod closure there is
        # deliberately gitignored (verbatim upstream bytes; see .gitignore),
        # so a fresh checkout fails the walk until the closure is staged.
        # --closure-only stages from the local canonical trees: no network,
        # no officialweb re-sync. The git diff guard keeps the closures gate's
        # semantics honest — the staging must be a no-op on every TRACKED
        # rawfile file (the closures gate byte-verifies those against the same
        # pins); a diff here means the committed rawfile itself drifted.
        run: |
          hosts/harmony/ci/vendor-official.sh --closure-only
          git diff --exit-code -- hosts/harmony/entry/src/main/resources/rawfile \
            || { echo "::error::the committed harmony rawfile drifted from runtime/spike — run build/build.sh sync harmony and commit" >&2; exit 1; }
      # tree-sitter grammars need no separate install: govrail already
      # depends on tree_sitter 0.26 + tree-sitter-typescript 0.23.2, which the
      # code-size gate reuses for exact TS/JS spans. Do NOT pip-install an
      # older tree-sitter core here — downgrading the core breaks govrail's
      # own parsers (ABI mismatch, seen in CI run 35297964574).
      - name: Run the gate DAG
        run: gov run
