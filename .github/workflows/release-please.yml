name: release/please
# The version stream. release-please reads the conventional commits landing on
# main and keeps ONE open release PR that bumps `version.txt`, writes
# `CHANGELOG.md`, and syncs the three host version manifests (see
# release-please-config.json for the extra-file wiring). Merging that PR is
# what cuts a release: a `vX.Y.Z` tag plus a GitHub Release, which is the
# event `release.yml` then builds the three host packages for and attaches.
#
# WHY secrets.GITHUB_TOKEN, AND NO PAT
# Events created by GITHUB_TOKEN do not trigger workflows, and `main` requires
# the `gates` check — so a release PR opened with GITHUB_TOKEN receives no
# check and could never be merged through normal review. That is why this
# workflow used to demand a fine-grained PAT.
#
# But `workflow_dispatch` is a documented EXCEPTION to the suppression rule, so
# the check can be produced without any long-lived credential: the last step
# runs the `gov` workflow on the release branch explicitly, and its `gates`
# check lands on the same commit `main` protection asks about. That is a real
# gate run on the real commit — nothing is bypassed, and nothing is fabricated
# through the Checks API.
#
# The PAT it replaces had become the pipeline's single point of failure: a
# fine-grained PAT that authenticates and carries `contents: write` but not
# `pull requests: write` gets release-please all the way to its final API call
# and then dies there, leaving the version stream dead for days (live case:
# runs 35589125560 / 35597056914). A credential this workflow no longer needs
# cannot be misconfigured.
#
# WHAT IS GIVEN UP: the three platform pipelines (`dev/ios`, `dev/android`,
# `dev/harmonyos`) also do not run on the release PR, since a PAT's events
# were the only thing that would have started them. A release PR changes only
# version numbers in those hosts, and `release/packages` builds and verifies
# all three on the `release: published` event regardless — so the loss is a
# preview, not a verification.
#
# The trigger is `push: main` only: release-please derives every state
# transition from what already landed. `workflow_dispatch` exists for recovery
# — re-running after a failure, or after the first release PR is opened.

on:
  push:
    branches: [main]
  workflow_dispatch:

# One release PR at a time. Deliberately NOT cancel-in-progress: the action
# mutates the release branch, and cancelling it mid-write leaves that branch
# in a state the next run has to reconcile. A queued run is cheap.
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  # Only used by the last step, to dispatch the `gov` workflow at the release
  # branch. Without it the dispatch is refused and the release PR would sit
  # with an unproduced required check.
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Give the release PR its required gates check
        # See "WHY secrets.GITHUB_TOKEN" above: the PR this run just opened or
        # updated will never receive a `pull_request` event, so the required
        # `gates` check has to be produced by an explicit dispatch. A failed
        # dispatch fails this job — a release PR that cannot be merged is a
        # breakage to announce, not to leave sitting (rules.md rule 5).
        #
        # No wait on the dispatched run: the check on the PR IS the
        # enforcement, and waiting here would only duplicate it.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch=$(gh pr list --state open --limit 100 --json headRefName \
            --jq '.[] | select(.headRefName | startswith("release-please--")) | .headRefName' \
            | head -1)
          if [ -z "$branch" ]; then
            echo "no open release PR — nothing to check"
            exit 0
          fi
          echo "release PR branch: $branch"
          gh workflow run gov.yml --ref "$branch"
          echo "dispatched the gov workflow on $branch"
