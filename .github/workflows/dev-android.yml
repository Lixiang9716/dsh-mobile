name: dev/android
# End-to-end Android pipeline. Scaffolded at M0; the Gradle build and
# emulator E2E land with the M4 Android project in hosts/android
# (docs/ARCHITECTURE.md §10).
#
# ubuntu-latest ships the Android SDK (ANDROID_HOME, sdkmanager, emulator)
# with KVM hardware acceleration, so emulator E2E runs natively in CI —
# no macOS-priced runners needed.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "hosts/android/**"
      - ".github/workflows/dev-android.yml"
  pull_request:
    paths:
      - "hosts/android/**"
      - ".github/workflows/dev-android.yml"

jobs:
  android-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Locate the Gradle project (lands at M4)
        run: |
          if [ -f "hosts/android/settings.gradle" ] || [ -f "hosts/android/settings.gradle.kts" ]; then
            echo "PROJECT_PRESENT=true" >> "$GITHUB_ENV"
          else
            echo "::warning::No Gradle project in hosts/android yet — build and E2E land at M4"
          fi

      - name: Build APK (debug)
        if: env.PROJECT_PRESENT == 'true'
        working-directory: hosts/android
        run: |
          ./gradlew assembleDebug --no-daemon

      # M4 will add (E2E by logs, never screenshots — ARCHITECTURE.md §3):
      #   Emulator boot (ubuntu KVM: system-images;android-35;default/arm64-v8a)
      #   install assembleDebug APK, adb launch, drive the flows (session
      #   start, tool approval, streaming, checkpoint/resume)
      #   Assertions: unique scenario-id per scenario, one structured logcat
      #   entry per expected event, one-to-one expected<->logged matching.
