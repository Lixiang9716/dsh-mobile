name: dev/android
# End-to-end Android pipeline: builds the M1 dsh APK (hosts/android) and
# verifies scenario `boot.verification` on a real emulator, judged by logs only
# (test/e2e/check.mjs one-to-one match; screenshots are never the assertion
# — docs/ARCHITECTURE.md, "E2E verification").
#
# ubuntu-latest ships the Android SDK (ANDROID_HOME, sdkmanager, emulator)
# with KVM hardware acceleration, so the emulator runs natively in CI —
# no macOS-priced runners needed.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "hosts/android/**"
      - "contract/**"
      - "runtime/**"
      - "system-plugins/**"
      - "presentation/**"
      - ".github/workflows/dev-android.yml"
  pull_request:
    paths:
      - "hosts/android/**"
      - "contract/**"
      - "runtime/**"
      - "system-plugins/**"
      - "presentation/**"
      - ".github/workflows/dev-android.yml"

# Superseded runs cancel here: a newer push's verdict is the branch's state, and
# an interleaved stale run answering late reads as a flake. The release
# pipelines deliberately do NOT cancel (see theirs) — and note this block is
# new: without it, two pushes in quick succession each kept a macOS runner and
# two ubuntu runners running to completion.
concurrency:
  group: dev-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      # Same unpacked-cache pattern as dev/harmonyos: tool + dependency state
      # survives between runs (Gradle caches include the wrapper distribution).
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # The dsh pins NDK 27.0.12077973 + CMake 3.22.1 (hosts/android/app/
      # build.gradle.kts); ubuntu-latest images ship other NDK versions. The
      # system image is idempotent: present on runner images, downloaded here
      # when a future image drops it.
      - name: Install the pinned NDK, CMake, and the API 35 system image
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" "cmake;3.22.1" "system-images;android-35;default;x86_64" > /dev/null

      # The reproducible builds (ensure-official-dist / ensure-client-bundles)
      # need node + corepack; the runner's default node carries an older
      # corepack whose pnpm signature verification fails on the rotated
      # registry keys. Pin a modern node and drop the signature check — the
      # built bytes are verified against the committed MANIFEST.sha256 anyway.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # The APK packs the vendored official web app (dist + application-tier
      # client bundles — untracked, manifest-verified, reproducible); the
      # Gradle build fails loud without them. ensure-dsh pins the bootstrap
      # package the web-plugins staging overlay prefers.
      # The upstream monorepo builds (tsdown/vite over 58 packages) die
      # SIGKILLed mid-build on the hosted runner — no error, the log just
      # stops: RAM/disk pressure. /mnt is the large ephemeral disk; swap
      # there absorbs the spikes, and free/df at failure time diagnose any
      # repeat.
      - name: Add swap for the upstream builds
        run: |
          sudo fallocate -l 6G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Locate the pnpm store
        # Resolved, never guessed: `pnpm store path` prints it, and a guessed
        # path would silently cache nothing.
        id: pnpm-store
        run: |
          set -euo pipefail
          corepack enable
          echo "path=$(corepack pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        # The upstream build's `pnpm install --frozen-lockfile` pulls the whole
        # monorepo's dependency graph on every run, and it is a large part of
        # why this step costs minutes. The STORE is the thing that is safe to
        # cache: it is content-addressed and carries no path assumptions,
        # unlike node_modules or a build output whose symlinks point at paths
        # that only exist on the machine that made them (pnpm#6374, #10081).
        # Restoring it lets install resolve locally while the build still
        # PRODUCES AND VERIFIES the tree — so nothing here depends on a cached
        # artifact being byte-reproducible.
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('presentation/official-web/build-upstream.sh', 'presentation/official-web/client-bundles/build-client-bundles.sh') }}

      - name: Cache the materialized official web tree
        # The most expensive single item in this repository's CI: the upstream
        # monorepo build behind `official-web/dist` + `client-bundles/npm`
        # measured 334-465 s on ubuntu and 602-779 s on macOS before it was
        # cached. Both ensure-*.sh scripts are idempotent — tree present and
        # MANIFEST-verified means exit 0 — so restoring the cache turns that
        # build into a verify. The key is the provenance set that decides the
        # bytes (both MANIFESTs, both build recipes, the roster, and the two
        # verifiers); any pin or recipe change changes the key and the tree is
        # rebuilt. Never a silent stale tree: the verifiers check it either way.
        uses: actions/cache@v6
        with:
          path: |
            presentation/official-web/dist
            presentation/official-web/client-bundles/npm
            presentation/official-web/client-bundles/MANIFEST.sha256.computed
          key: official-web-${{ hashFiles('presentation/official-web/MANIFEST.sha256', 'presentation/official-web/build-upstream.sh', 'presentation/official-web/client-bundles/MANIFEST.sha256', 'presentation/official-web/client-bundles/build-client-bundles.sh', 'presentation/official-web/client-bundles/ROSTER.json', 'test/e2e/ensure-official-dist.sh', 'test/e2e/ensure-client-bundles.sh') }}
      - name: Cache the vendored upstream closure
        # ensure.sh + ensure-dsh.sh re-download the pinned quickjs-ng / DSH
        # closure on every run, and six workflows do it — 29 s of it in dev/ios
        # alone. Keyed on the pin scripts, which ARE the tracked provenance
        # record (D6/D9), so a pin change rotates the key. Safe because they
        # re-verify sha256 over whatever lands: a restored tree is verified, not
        # trusted. Single-line key on purpose — a folded scalar can resolve to a
        # literal and give a cache that never hits.
        uses: actions/cache@v6
        with:
          path: |
            runtime/dsh/vendor/quickjs-ng
            runtime/dsh/vendor/dsh
            runtime/dsh/vendor/npm
          key: vendor-${{ runner.os }}-${{ hashFiles('runtime/dsh/vendor/ensure.sh', 'runtime/dsh/vendor/ensure-dsh.sh') }}

      - name: Materialize the vendored official web app
        env:
          COREPACK_INTEGRITY_KEYS: '0'
          NODE_OPTIONS: '--max-old-space-size=3072'
        run: |
          # Upstream's own build scripts spawn BARE `pnpm` (build:web does
          # `pnpm --filter ...`), so the pinned shim must be on PATH — a
          # `corepack pnpm` entry point alone dies there ("pnpm: not found").
          corepack enable
          runtime/dsh/vendor/ensure-dsh.sh > /dev/null
          test/e2e/ensure-official-dist.sh || {
            free -h; df -h / /tmp /mnt
            exit 1
          }
          test/e2e/ensure-client-bundles.sh || {
            free -h; df -h / /tmp /mnt
            exit 1
          }

      - name: Build APK (debug)
        working-directory: hosts/android
        run: ./gradlew assembleDebug --no-daemon

      # The emulator is driven directly: android-emulator-runner executes its
      # script one `sh -c` per line and its post-boot animation pass failed
      # broken-pipe right after boot (two red runs). Backgrounded here, it
      # survives into the next step; run-dsh-e2e.sh owns the whole E2E.
      - name: Boot the emulator (background, KVM)
        run: |
          # /dev/kvm on hosted runners is root:kvm 0660 — the runner user
          # cannot write it, the emulator dies at spawn, and every later adb
          # wait would hang. Passwordless sudo is available; make it usable.
          sudo chmod 666 /dev/kvm
          # adb/emulator are not on PATH outside the (dropped) runner action;
          # GITHUB_PATH persists into the verify step.
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          # Pin the AVD home explicitly for BOTH avdmanager and the emulator:
          # on the current runner image the default location is not
          # $HOME/.android/avd (create "succeeded" there while the emulator
          # searched $HOME and died on Unknown AVD name). One variable,
          # one location, checked before boot.
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          # `-d pixel_7` makes avdmanager fully non-interactive — without a
          # --device it prompts for a custom hardware profile, and with
          # piped stdin a newer avdmanager answers EOF as a SILENT CANCEL
          # (exit 0, no AVD created). The ini check keeps any such failure
          # loud here instead of cascading into the boot stage.
          "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n dsh-host -k "system-images;android-35;default;x86_64" -d pixel_7 --force < /dev/null
          test -f "$ANDROID_AVD_HOME/dsh-host.ini" || {
            echo "::error::AVD create did not produce dsh-host.ini in $ANDROID_AVD_HOME"
            ls -la "$ANDROID_AVD_HOME" 2>&1 || true
            exit 1
          }
          nohup "$ANDROID_HOME/emulator/emulator" -avd dsh-host -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -port 5554 > /tmp/emulator.log 2>&1 < /dev/null &

      # E2E by logs (AGENTS.md rule 7): capture the canonical dsh.runtime lines
      # from logcat and let test/e2e/check.mjs deliver the verdict. One
      # invocation; every wait inside is a polled condition with a deadline.
      - name: Run boot.verification + gateway.bridge-smoke + session.mock-llm on the emulator and verify (logs only)
        run: bash hosts/android/ci/run-dsh-e2e.sh

      - name: Run the upstream parity differential on the emulator (vendored spine vs the committed Node golden)
        run: sh hosts/android/ci/run-upstream-parity.sh

      # The capability plane's BLE face: the mock-radio leg verifies the
      # envelope + audit through the REAL gateway enforcement (no radio
      # needed); the skip posture of the same scenario runs locally
      # (run-ble.sh skip — the emulator's virtual radio answers the OS
      # layer's `denied` honestly).
      - name: Run the BLE mock-radio leg on the emulator and verify (logs only)
        run: sh hosts/android/ci/run-ble.sh mock

      # The full runner's phases 2-5 on the SAME emulator (#332's process
      # half): the capability binding, the official web mount + the
      # ui.occlusion layout-truth probe, the live read, the composer write.
      # These contract pins rotted twice (#176, #332) because nothing
      # executed them between capability landings — phase 1's scenarios
      # already ran above via run-dsh-e2e.sh, so only 2-5 run here, with
      # every artifact redirected off the committed evidence dirs into /tmp.
      # The camera grant is the run-camera-plane.sh discipline (the binding
      # scenario asserts the descriptor's availability rows, and a fresh CI
      # AVD carries no grant state).
      - name: Run the full runner's phases 2-5 (binding + official mount + occlusion probe + live read/write)
        run: |
          adb shell pm grant com.dshmobile.host android.permission.CAMERA 2>/dev/null \
            || echo "CAMERA grant skipped (already granted)"
          DSH_PHASES=2,3,4,5 DSH_WEB_ART=/tmp/dsh-full-web DSH_SESSION_ART=/tmp/dsh-full-session DSH_WRITE_ART=/tmp/dsh-full-write \
            bash hosts/android/ci/run-android-full.sh

      # The official seat's page-open pin (loop-t): a fresh boot of the DEFAULT
      # seat must navigate the app webview to the carrier origin. a3e35d72
      # dropped the settings.probes.done bus post and the page silently never
      # opened again — url stayed '' forever, zero FAIL lines — while every
      # other leg above stayed green, because nothing else drives the default
      # seat (phase 2 mounts --ez dsh.m4, the next-mount leg dsh.next). The
      # seat is release-flavor only (MainActivity: isRelease -> bootRelease),
      # so the release APK is built and signed here (debug keystore — the same
      # cert the install evidence records; not a distribution signing step).
      - name: Build + sign the release APK (debug keystore, for the page-open pin)
        working-directory: hosts/android
        run: |
          ./gradlew assembleRelease --no-daemon
          # The hosted runner does not always carry a debug keystore (measured
          # 2026-10-04: apksigner died on the missing file even after
          # assembleDebug) — generate the standard one when absent. Not a
          # distribution signature: the pin only needs an installable APK.
          [ -f "$HOME/.android/debug.keystore" ] || \
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$HOME/.android/debug.keystore" --ks-pass pass:android \
            --out app/build/outputs/apk/release/app-release-signed.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            app/build/outputs/apk/release/app-release-signed.apk

      - name: Run the official seat page-open pin (fresh boot -> devtools /json/list url)
        run: sh hosts/android/ci/run-page-open.sh

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m1-dsh-e2e-logs
          path: |
            /tmp/dsh-host-logs.txt
            /tmp/dsh-dsh-results.txt
            /tmp/dsh-dsh-verdict-m1.json
            /tmp/dsh-dsh-verdict-m2.json
            /tmp/dsh-dsh-verdict-session.json
            /tmp/dsh-full-*/logs.txt
            /tmp/dsh-full-*/verdict-*.json
            /tmp/dsh-page-open/**
            /tmp/dsh-m4-verdict-*.json
            hosts/android/artifacts/upstream-parity/**
            /tmp/emulator.log
          if-no-files-found: ignore
