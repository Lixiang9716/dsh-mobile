name: dev/android
# End-to-end Android pipeline: builds the M1 spike APK (hosts/android) and
# verifies scenario `m1.spike.boot` on a real emulator, judged by logs only
# (tools/e2e/check.mjs one-to-one match; screenshots are never the assertion
# — docs/ARCHITECTURE.md, "E2E verification").
#
# ubuntu-latest ships the Android SDK (ANDROID_HOME, sdkmanager, emulator)
# with KVM hardware acceleration, so the emulator runs natively in CI —
# no macOS-priced runners needed.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "hosts/android/**"
      - "contract/**"
      - "runtime/**"
      - "system-plugins/**"
      - "presentation/**"
      - ".github/workflows/dev-android.yml"
  pull_request:
    paths:
      - "hosts/android/**"
      - "contract/**"
      - "runtime/**"
      - "system-plugins/**"
      - "presentation/**"
      - ".github/workflows/dev-android.yml"

jobs:
  android-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # Same unpacked-cache pattern as dev/harmonyos: tool + dependency state
      # survives between runs (Gradle caches include the wrapper distribution).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # The spike pins NDK 27.0.12077973 + CMake 3.22.1 (hosts/android/app/
      # build.gradle.kts); ubuntu-latest images ship other NDK versions.
      - name: Install the pinned NDK and CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null

      - name: Cache the emulator system image and AVD
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/system-images/android-35/default/x86_64*
            ~/.android/avd/*
          key: dev-android-emulator-api35-x86_64-v1

      - name: Build APK (debug)
        working-directory: hosts/android
        run: ./gradlew assembleDebug --no-daemon

      # E2E by logs (AGENTS.md rule 7): capture the canonical dsh.spike lines
      # from logcat and let tools/e2e/check.mjs deliver the verdict.
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          script: |
            adb install -r hosts/android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -n com.dshmobile.spike/.MainActivity
            # Poll the completion tag with a deadline — never a blind wait.
            deadline=$((SECONDS+120))
            until adb logcat -d -s dsh.spike.result | grep -q dsh.spike.result; do
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "::error::scenario m1.spike.boot did not complete within 120s"
                adb logcat -d | tail -200
                exit 1
              fi
              sleep 2
            done
            adb logcat -d -s dsh.spike > /tmp/dsh-spike-logs.txt
            node tools/e2e/check.mjs \
              --manifest tools/e2e/scenarios/m1-spike-boot.json \
              --log /tmp/dsh-spike-logs.txt \
              --out /tmp/dsh-spike-verdict.json

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-spike-e2e-logs
          path: |
            /tmp/dsh-spike-logs.txt
            /tmp/dsh-spike-verdict.json
          if-no-files-found: ignore
