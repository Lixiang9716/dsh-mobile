name: dev/android
# End-to-end Android pipeline: builds the M1 spike APK (hosts/android) and
# verifies scenario `m1.spike.boot` on a real emulator, judged by logs only
# (tools/e2e/check.mjs one-to-one match; screenshots are never the assertion
# — docs/ARCHITECTURE.md, "E2E verification").
#
# ubuntu-latest ships the Android SDK (ANDROID_HOME, sdkmanager, emulator)
# with KVM hardware acceleration, so the emulator runs natively in CI —
# no macOS-priced runners needed.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "hosts/android/**"
      - "contract/**"
      - "runtime/**"
      - "system-plugins/**"
      - "presentation/**"
      - ".github/workflows/dev-android.yml"
  pull_request:
    paths:
      - "hosts/android/**"
      - "contract/**"
      - "runtime/**"
      - "system-plugins/**"
      - "presentation/**"
      - ".github/workflows/dev-android.yml"

jobs:
  android-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # Same unpacked-cache pattern as dev/harmonyos: tool + dependency state
      # survives between runs (Gradle caches include the wrapper distribution).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # The spike pins NDK 27.0.12077973 + CMake 3.22.1 (hosts/android/app/
      # build.gradle.kts); ubuntu-latest images ship other NDK versions. The
      # system image is idempotent: present on runner images, downloaded here
      # when a future image drops it.
      - name: Install the pinned NDK, CMake, and the API 35 system image
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" "cmake;3.22.1" "system-images;android-35;default;x86_64" > /dev/null

      - name: Build APK (debug)
        working-directory: hosts/android
        run: ./gradlew assembleDebug --no-daemon

      # The emulator is driven directly: android-emulator-runner executes its
      # script one `sh -c` per line and its post-boot animation pass failed
      # broken-pipe right after boot (two red runs). Backgrounded here, it
      # survives into the next step; run-spike-e2e.sh owns the whole E2E.
      - name: Boot the emulator (background, KVM)
        run: |
          # /dev/kvm on hosted runners is root:kvm 0660 — the runner user
          # cannot write it, the emulator dies at spawn, and every later adb
          # wait would hang. Passwordless sudo is available; make it usable.
          sudo chmod 666 /dev/kvm
          # adb/emulator are not on PATH outside the (dropped) runner action;
          # GITHUB_PATH persists into the verify step.
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n dsh-spike -k "system-images;android-35;default;x86_64" --force
          nohup "$ANDROID_HOME/emulator/emulator" -avd dsh-spike -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -port 5554 > /tmp/emulator.log 2>&1 < /dev/null &

      # E2E by logs (AGENTS.md rule 7): capture the canonical dsh.spike lines
      # from logcat and let tools/e2e/check.mjs deliver the verdict. One
      # invocation; every wait inside is a polled condition with a deadline.
      - name: Run m1.spike.boot on the emulator and verify (logs only)
        run: bash hosts/android/ci/run-spike-e2e.sh

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-spike-e2e-logs
          path: |
            /tmp/dsh-spike-logs.txt
            /tmp/dsh-spike-verdict.json
            /tmp/emulator.log
          if-no-files-found: ignore
