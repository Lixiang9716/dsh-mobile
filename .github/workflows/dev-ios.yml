name: dev/ios
# End-to-end iOS pipeline. Since M1 this builds the spike app in hosts/ios
# (quickjs-ng + dsh_spike_host.c) and, when the runner has a usable iOS
# simulator, runs BOTH spike scenarios — m1.spike.boot (runtime shim) and
# m1.carrier.loopback (loopback static+WS carrier) — in one launch and
# verifies the canonical log lines with the shared checker
# (test/e2e/check.mjs) — logs are the verdict, screenshots are never
# asserted on (docs/ARCHITECTURE.md).
#
# Since M2 it also checks m2.gateway.binding + the gateway audit stream
# (test/e2e/scenarios/m2-gateway-*.json). HONEST LIMITATION: that scenario
# is UI-driven (permission alert, Files picker, approval dialog, notification
# banner) and hosted CI runners have no idb/UI driver, so the m2 leg cannot
# complete here — its step is continue-on-error and expected to skip/warn.
# The build is the hard gate; the FULL m2 E2E runs locally via
# test/e2e/run-ios.sh (see test/e2e/README.md).
#
# Manual trigger plus path-filtered pushes/PRs: macOS runner minutes bill at
# 10x, so docs-only changes never reach this pipeline.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "hosts/ios/**"
      - "contract/**"
      - "runtime/**"
      - "system-plugins/**"
      - "presentation/**"
      - "test/e2e/**"
      - ".github/workflows/dev-ios.yml"
  pull_request:
    paths:
      - "hosts/ios/**"
      - "contract/**"
      - "runtime/**"
      - "system-plugins/**"
      - "presentation/**"
      - "test/e2e/**"
      - ".github/workflows/dev-ios.yml"

# Superseded runs cancel here: a newer push's verdict is the branch's state, and
# an interleaved stale run answering late reads as a flake. The release
# pipelines deliberately do NOT cancel (see theirs) — and note this block is
# new: without it, two pushes in quick succession each kept a macOS runner and
# two ubuntu runners running to completion.
concurrency:
  group: dev-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-e2e:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # Same unpacked-cache pattern as dev/harmonyos: xcodebuild uses
      # -derivedDataPath hosts/ios/DerivedData so incremental builds restore
      # from this cache (SwiftPM + module cache).
      - name: Cache DerivedData
        uses: actions/cache@v5
        with:
          path: hosts/ios/DerivedData
          # Keyed on the SOURCES, not a frozen literal. `dev-ios-deriveddata-v2`
          # was a static key: actions/cache writes it once and then never
          # refreshes it, so the cache was frozen at whatever first populated
          # it — measured, the app binary's UUID was byte-identical across three
          # consecutive runs. Keying on the sources rotates it when the app
          # changes, and the restore-keys prefix below still lands on the newest
          # previous cache, so an incremental build survives the rotation.
          #
          # Every pattern was checked to match tracked files (29 under
          # App/Source, 2 under Tools, project.yml, project.pbxproj) — a glob
          # that matches nothing makes hashFiles return the empty string, giving
          # a constant key and a cache step that silently never helps.
          key: dev-ios-deriveddata-${{ hashFiles('hosts/ios/App/Source/**', 'hosts/ios/App/Generated/**', 'hosts/ios/Tools/**', 'hosts/ios/project.yml', 'hosts/ios/DSHSpike.xcodeproj/project.pbxproj') }}
          # A static key with no fallback is written once and then never
          # refreshed — every later run restores the same frozen tree. The
          # prefix fallback lets a newer save land and be picked up, while the
          # primary key still pins the fast path.
          restore-keys: |
            dev-ios-deriveddata-

      - name: Toolchain sanity
        run: |
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes | head -5

      # Materialize the pinned quickjs-ng engine sources (sha256-verified;
      # network only needed on first fetch). Must precede any build that
      # embeds the engine (runtime/spike/README.md embedding contract).
      # ensure-dsh.sh materializes the pinned upstream DSH closure — the
      # GenerateSpikeBundle phase pins it at alpha.2 (gen_bundle_header.py),
      # so a build without it fails PhaseScriptExecution. That failure was
      # INVISIBLE here until the build step got `set -o pipefail` (the
      # `| tail -30` swallowed xcodebuild's exit status); this step is the
      # fix for the breakage that had been landing green since the D9 bump.
      - name: Prewarm the simulator (background)
        # The simulator's first boot does one-time runtime work (the dyld shared
        # cache among it) and on a hosted runner that can take minutes. Booting
        # it here, without waiting, lets that happen while the rest of the job
        # runs, instead of landing inside the E2E step where it is measured and
        # mistaken for a hang. Idempotent: the E2E step boots again and tolerates
        # "already booted".
        #
        # No continue-on-error: it already exits 0 with a warning when there is
        # no simulator to prewarm, so a non-zero exit here means something real
        # went wrong — and absorbing it would be another failure nobody sees.
        run: |
          set -euo pipefail
          # The SAME pinned preference list as the E2E step below, and that is
          # not cosmetic: the prewarm exists to warm the device the E2E will
          # use. Taking any iPhone here could warm a different one, in which
          # case the E2E pays the cold-boot cost the prewarm was meant to
          # remove — a silent no-op that looks like a working optimisation.
          UDID=""
          for want in "iPhone 16 Pro" "iPhone 17" "iPhone 16" "iPhone 15"; do
            UDID=$(xcrun simctl list devices available | grep -F "$want (" \
              | grep -m1 -oE '[A-F0-9]{8}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{12}' || true)
            [ -n "$UDID" ] && break
          done
          if [ -z "$UDID" ]; then
            echo "::warning::no available iPhone simulator to prewarm"
            exit 0
          fi
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          echo "prewarming $UDID (background — not waited on)"
          ( xcrun simctl boot "$UDID" >/dev/null 2>&1 || true ) &
          echo "prewarm dispatched"

      - name: Cache the vendored upstream closure
        # ensure.sh + ensure-dsh.sh re-download the pinned quickjs-ng / DSH
        # closure on every run, and six workflows do it — 29 s of it in dev/ios
        # alone. Keyed on the pin scripts, which ARE the tracked provenance
        # record (D6/D9), so a pin change rotates the key. Safe because they
        # re-verify sha256 over whatever lands: a restored tree is verified, not
        # trusted. Single-line key on purpose — a folded scalar can resolve to a
        # literal and give a cache that never hits.
        uses: actions/cache@v5
        with:
          path: |
            runtime/spike/vendor/quickjs-ng
            runtime/spike/vendor/dsh
            runtime/spike/vendor/npm
          key: vendor-${{ runner.os }}-${{ hashFiles('runtime/spike/vendor/ensure.sh', 'runtime/spike/vendor/ensure-dsh.sh') }}

      - name: Vendor quickjs-ng + the pinned upstream DSH closure
        run: |
          set -euo pipefail
          runtime/spike/vendor/ensure.sh
          runtime/spike/vendor/ensure-dsh.sh

      # Real, unconditional build: compiles + links the app for the iOS
      # simulator. Generic destination so it does not depend on which
      # simulator devices the runner image ships.
      - name: Build spike app
        run: |
          set -o pipefail
          cd hosts/ios
          xcodebuild build \
            -project DSHSpike.xcodeproj \
            -scheme DSHSpike \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            | tail -30

      # Boot + install + launch + verify. Best-effort on CI: hosted runner
      # images are not guaranteed to ship a simulator runtime this Xcode can
      # boot, so ONLY this emulator-stage step is continue-on-error — the
      # build above is real and always gates the pipeline. When a simulator
      # is available this step must be green too; a red here with green
      # build is reported, not hidden (the verdict file + logs are uploaded
      # either way for diagnosis).
      - name: Run m1.spike.boot + m1.carrier.loopback on simulator and verify
        id: spike-run
        run: |
          set -euo pipefail
          ART=hosts/ios/artifacts/m1-spike
          ART2=hosts/ios/artifacts/m1-carrier
          mkdir -p "$ART" "$ART2"
          # Match any iPhone device line regardless of name suffix ("iPhone 16",
          # "dsh-iphone", …) — the literal 'iPhone (' never occurs in stock
          # runner device names, which silently disabled this stage.
          # Same PINNED preference list as the prewarm step above — see the
          # comment there for why it is a preference and not a hard pin.
          UDID=""
          for want in "iPhone 16 Pro" "iPhone 17" "iPhone 16" "iPhone 15"; do
            UDID=$(xcrun simctl list devices available | grep -F "$want (" \
              | grep -m1 -oE '[A-F0-9]{8}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{12}' || true)
            [ -n "$UDID" ] && break
          done
          if [ -z "$UDID" ]; then
            echo "::warning::no preferred simulator on this runner — falling back to any iPhone, which weakens run-to-run comparability"
            UDID=$(xcrun simctl list devices available | grep -iE 'iphone' \
              | grep -m1 -oE '[A-F0-9]{8}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{12}' || true)
          fi
          [ -n "$UDID" ] || { echo "::warning::no available iPhone simulator on this runner"; exit 1; }
          echo "using simulator $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          # `bootstatus -b` returns early on an already-booted device, and on the
          # first boot of a freshly downloaded runtime it can return before
          # SpringBoard is up — the launch is then denied (SBMainWorkspace,
          # code=1). Poll a real readiness condition with a deadline; never a
          # fixed sleep.
          for i in $(seq 1 30); do
            xcrun simctl spawn "$UDID" launchctl print system >/dev/null 2>&1 && break
            sleep 1
          done
          xcrun simctl spawn "$UDID" launchctl print system >/dev/null 2>&1 \
            || echo "::warning::simulator readiness probe never succeeded — continuing, but the launch may be denied"
          xcrun simctl install "$UDID" hosts/ios/DerivedData/Build/Products/Debug-iphonesimulator/DSHSpike.app
          # simctl launch APPENDS to the capture files; the committed evidence
          # from the local run must go so the checker sees only this run.
          rm -f "$ART/logs.txt" "$ART/nslog-stderr.txt"
          # Capture the launch outcome; do not let it abort the step.
          # `simctl launch` exits 3 when the app launched and then exited or
          # crashed (FBSOpenApplicationServiceErrorDomain, code=3) — measured on
          # run 35610169977, where `set -e` then killed the step BEFORE the
          # wait loop and the checkers ran, so CI reported green having
          # verified nothing at all. The launch result is EVIDENCE, not a
          # control-flow signal: record it loudly, keep going, and let the
          # checkers say what the captured log supports. A crash then shows up
          # as failed verdicts (the honest outcome) instead of a red annotation
          # on a green run that nobody reads.
          # ROOT CAUSE of the launch crash (measured, not guessed): the binary
          # hard-links /usr/lib/swift/libswiftWebKit.dylib because exactly one
          # symbol comes from the WebKit Swift overlay (WKWebView
          # .callAsyncJavaScript, NS_REFINED_FOR_SWIFT). On the iOS 18.5
          # simulator that path does not exist under RuntimeRoot — only under
          # System/Cryptexes/OS — so dyld aborts BEFORE main() and the app
          # produces a 0-byte log. Upstream defect: WebKit bug 293831, hitting
          # apps whose deployment target is <= 18.3 (this project: 17.0). Real
          # devices are unaffected. Verified on the exact runtime (22F77):
          # 7/7 launches died without this, 3/3 succeeded with it, and it is
          # harmless on a runtime that already has the path.
          RTKEY=$(xcrun simctl list devices --json | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(k for k,vs in d.items() for v in vs if v['udid']=='$UDID'))")
          RUNTIME_ROOT=$(xcrun simctl list runtimes --json | python3 -c "import json,sys; print(next(r['runtimeRoot'] for r in json.load(sys.stdin)['runtimes'] if r['identifier']=='$RTKEY'))")
          echo "runtime: $RTKEY"
          launch_rc=0
          SIMCTL_CHILD_DYLD_FALLBACK_LIBRARY_PATH="$RUNTIME_ROOT/System/Cryptexes/OS/usr/lib/swift" \
          xcrun simctl launch --terminate-running-process \
            --stdout="$PWD/$ART/logs.txt" \
            --stderr="$PWD/$ART/nslog-stderr.txt" \
            "$UDID" org.dsh.DSHSpike || launch_rc=$?
          if [ "$launch_rc" != "0" ]; then
            echo "::error::simctl launch exited $launch_rc — the app launched and then exited or crashed. Captured log + screenshot are uploaded; the checks below run on whatever was captured."
          fi
          # One launch drives the two m1 scenarios and then the UI-driven m2
          # leg; wait with a deadline — never a blind sleep. On CI nobody can
          # tap the m2 prompts, so the run stalls at the first `spike:
          # ui-wait` marker; accepting that marker as the stop condition lets
          # the m1 checks still run on the captured m1 lines (all m1 events
          # are complete before the UI-driven leg starts). Locally, via
          # test/e2e/run-ios.sh, the terminal `spike: sequence` marker
          # appears as before.
          # Stop on the terminal marker, OR once the log has gone QUIET with
          # the app having emitted: measured on CI, `simctl launch` returns and
          # the m1 events are all written, but the terminal marker never comes
          # because the UI-driven m2 leg cannot be tapped. The old marker-only
          # condition then exited 1 before the checkers ran, so real evidence on
          # disk went unverified and every green run carried a red annotation.
          # Idle is asserted (no new bytes for 8 x 2 s), never a blind sleep.
          last=-1; idle=0
          for i in $(seq 1 90); do
            grep -qE "spike: (sequence|ui-wait)" "$ART/logs.txt" 2>/dev/null && break
            now=$(wc -c < "$ART/logs.txt" 2>/dev/null || echo 0)
            if [ "$now" = "$last" ] && [ "$now" -gt 0 ]; then
              idle=$((idle + 1))
              [ "$idle" -ge 8 ] && break
            else
              idle=0
            fi
            last="$now"
            sleep 2
          done
          # The only thing worth failing on is "the app produced nothing".
          grep -q '^dsh.spike.log:' "$ART/logs.txt" \
            || { echo "::error::no dsh.spike.log lines — the app never ran"; exit 1; }
          grep -q "spike: sequence" "$ART/logs.txt" \
            || echo "::notice::terminal marker absent (the UI-driven m2 leg cannot be driven on CI) — the completed m1 scenarios are verified below. Expected, not a defect."
          if grep -q "spike: ui-wait" "$ART/logs.txt" && ! grep -q "spike: sequence" "$ART/logs.txt"; then
            echo "::notice::run stalled at a UI-driven m2 prompt (no UI driver on CI) — the completed m1 scenarios are verified below. Expected, not a defect: see this step's header."
          fi
          xcrun simctl io "$UDID" screenshot "$ART2/screenshot.png" || true
          grep '^dsh.spike.log:' "$ART/logs.txt" > "$ART/scenario.jsonl"
          cp "$ART/scenario.jsonl" "$ART2/scenario.jsonl"
          # --junit writes the SAME verdict the --out file carries, rendered as
          # JUnit XML (test/e2e/junit.mjs): the artifact a PR reporter turns
          # into per-scenario annotations, so a red run names the scenario and
          # the mismatched expectation instead of only reddening the step. It
          # is written before the checker exits, so a FAILING run ships one too.
          # Both checkers ALWAYS run. Under `set -e` a failing first checker
          # aborted the step, so the second scenario produced no verdict and no
          # JUnit XML — a real failure was partially invisible, which is the
          # class of dishonesty this pipeline was just cleaned of. Accumulate
          # the exit codes and fail at the end if either failed, so both
          # verdicts and both XMLs are always authoritative.
          check_rc=0
          node test/e2e/check.mjs \
            --manifest test/e2e/scenarios/m1-spike-boot.json \
            --log "$ART/logs.txt" \
            --out "$ART/verdict.json" \
            --junit "$ART/verdict.xml" || check_rc=1
          node test/e2e/check.mjs \
            --manifest test/e2e/scenarios/m1-carrier-loopback.json \
            --log "$ART/logs.txt" \
            --out "$ART2/verdict.json" \
            --junit "$ART2/verdict.xml" || check_rc=1
          [ "$check_rc" = "0" ] || { echo "::error::one or more m1 scenarios FAILED — the verdicts above are authoritative"; exit 1; }

      # The M2 gateway-binding E2E is UI-driven — permission alert, Files
      # picker, approval dialog, notification banner (see
      # test/e2e/run-ios.sh, which drives it with WebDriverAgent/idb). Hosted
      # runners have no UI driver, so that leg CANNOT run here, and it used to
      # sit in this file as a step that warned and exited non-zero on every
      # run under continue-on-error: a failure that could never pass, absorbed
      # on every green run, which is how a pipeline teaches people to ignore
      # red. A check that cannot run is not a check, so it is not here. The
      # m2 E2E runs locally via test/e2e/run-ios.sh and its committed
      # evidence is what the matrix cites.
      #
      # What gates in this workflow: the build, and (below) the m1 scenarios —
      # which are log-driven and DO run on a hosted simulator.

      - name: Report verdict
        if: always()
        run: |
          # A verdict is only reported when THIS RUN produced it. Every one of
          # these paths is also a committed file, so `cat` alone cannot tell
          # today's result from a stale committed one — and it printed a
          # committed 9/9 PASS for a run that exited before its checkers ran.
          # check.mjs stamps runId when it runs under CI; a verdict without this
          # run's id is reported as ABSENT, which is the truth.
          reported=0
          for f in \
            hosts/ios/artifacts/m1-spike/verdict.json \
            hosts/ios/artifacts/m1-carrier/verdict.json \
            hosts/ios/artifacts/m2-gateway/verdict.json \
            hosts/ios/artifacts/m2-gateway/verdict-audit.json; do
            name="$(basename "$f")"
            if [ ! -f "$f" ]; then
              echo "$(dirname "$f" | xargs basename)/$name: no verdict file" | tee -a "$GITHUB_STEP_SUMMARY"
              continue
            fi
            rid=$(sed -n 's/.*"runId": *"\([^"]*\)".*/\1/p' "$f" | head -1)
            if [ -z "$rid" ]; then
              echo "$(dirname "$f" | xargs basename)/$name: NO PROVENANCE — not produced by a CI run (a committed file?)" | tee -a "$GITHUB_STEP_SUMMARY"
              continue
            fi
            if [ "$rid" != "$GITHUB_RUN_ID" ]; then
              echo "$(dirname "$f" | xargs basename)/$name: STALE — produced by run $rid, not this one" | tee -a "$GITHUB_STEP_SUMMARY"
              continue
            fi
            cat "$f" | tee -a "$GITHUB_STEP_SUMMARY"
            reported=$((reported + 1))
          done
          echo "" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "verdicts produced by THIS run: $reported" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: m1-spike-ios
          path: |
            hosts/ios/artifacts/m1-spike/
            hosts/ios/artifacts/m1-carrier/
            hosts/ios/artifacts/m2-gateway/
            # The JUnit XMLs rode along inside the dirs above already; naming
            # them keeps the annotation contract explicit rather than incidental.
            hosts/ios/artifacts/m1-spike/verdict.xml
            hosts/ios/artifacts/m1-carrier/verdict.xml
          if-no-files-found: warn
