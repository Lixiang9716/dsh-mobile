name: dev/ios
# End-to-end iOS pipeline. Since M1 this builds the spike app in hosts/ios
# (quickjs-ng + dsh_spike_host.c) and, when the runner has a usable iOS
# simulator, runs BOTH spike scenarios — m1.spike.boot (runtime shim) and
# m1.carrier.loopback (loopback static+WS carrier) — in one launch and
# verifies the canonical log lines with the shared checker
# (tools/e2e/check.mjs) — logs are the verdict, screenshots are never
# asserted on (docs/ARCHITECTURE.md).
#
# Since M2 it also checks m2.gateway.binding + the gateway audit stream
# (tools/e2e/scenarios/m2-gateway-*.json). HONEST LIMITATION: that scenario
# is UI-driven (permission alert, Files picker, approval dialog, notification
# banner) and hosted CI runners have no idb/UI driver, so the m2 leg cannot
# complete here — its step is continue-on-error and expected to skip/warn.
# The build is the hard gate; the FULL m2 E2E runs locally via
# tools/e2e/run-ios.sh (see tools/e2e/README.md).
#
# Manual trigger plus path-filtered pushes/PRs: macOS runner minutes bill at
# 10x, so docs-only changes never reach this pipeline.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "hosts/ios/**"
      - "contract/**"
      - "runtime/**"
      - "system-plugins/**"
      - "presentation/**"
      - "tools/e2e/**"
      - ".github/workflows/dev-ios.yml"
  pull_request:
    paths:
      - "hosts/ios/**"
      - "contract/**"
      - "runtime/**"
      - "system-plugins/**"
      - "presentation/**"
      - "tools/e2e/**"
      - ".github/workflows/dev-ios.yml"

# Superseded runs cancel here: a newer push's verdict is the branch's state, and
# an interleaved stale run answering late reads as a flake. The release
# pipelines deliberately do NOT cancel (see theirs) — and note this block is
# new: without it, two pushes in quick succession each kept a macOS runner and
# two ubuntu runners running to completion.
concurrency:
  group: dev-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-e2e:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Same unpacked-cache pattern as dev/harmonyos: xcodebuild uses
      # -derivedDataPath hosts/ios/DerivedData so incremental builds restore
      # from this cache (SwiftPM + module cache).
      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: hosts/ios/DerivedData
          key: dev-ios-deriveddata-v2
          # A static key with no fallback is written once and then never
          # refreshed — every later run restores the same frozen tree. The
          # prefix fallback lets a newer save land and be picked up, while the
          # primary key still pins the fast path.
          restore-keys: |
            dev-ios-deriveddata-

      - name: Toolchain sanity
        run: |
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes | head -5

      # Materialize the pinned quickjs-ng engine sources (sha256-verified;
      # network only needed on first fetch). Must precede any build that
      # embeds the engine (runtime/spike/README.md embedding contract).
      # ensure-dsh.sh materializes the pinned upstream DSH closure — the
      # GenerateSpikeBundle phase pins it at alpha.2 (gen_bundle_header.py),
      # so a build without it fails PhaseScriptExecution. That failure was
      # INVISIBLE here until the build step got `set -o pipefail` (the
      # `| tail -30` swallowed xcodebuild's exit status); this step is the
      # fix for the breakage that had been landing green since the D9 bump.
      - name: Prewarm the simulator (background)
        # The simulator's first boot does one-time runtime work (the dyld shared
        # cache among it) and on a hosted runner that can take minutes. Booting
        # it here, without waiting, lets that happen while the rest of the job
        # runs, instead of landing inside the E2E step where it is measured and
        # mistaken for a hang. Idempotent: the E2E step boots again and tolerates
        # "already booted".
        continue-on-error: true
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available | grep -iE 'iphone' \
            | grep -m1 -oE '[A-F0-9]{8}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{12}' || true)
          if [ -z "$UDID" ]; then
            echo "::warning::no available iPhone simulator to prewarm"
            exit 0
          fi
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          echo "prewarming $UDID (background — not waited on)"
          ( xcrun simctl boot "$UDID" >/dev/null 2>&1 || true ) &
          echo "prewarm dispatched"

      - name: Vendor quickjs-ng + the pinned upstream DSH closure
        run: |
          set -euo pipefail
          runtime/spike/vendor/ensure.sh
          runtime/spike/vendor/ensure-dsh.sh

      # Real, unconditional build: compiles + links the app for the iOS
      # simulator. Generic destination so it does not depend on which
      # simulator devices the runner image ships.
      - name: Build spike app
        run: |
          set -o pipefail
          cd hosts/ios
          xcodebuild build \
            -project DSHSpike.xcodeproj \
            -scheme DSHSpike \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            | tail -30

      # Boot + install + launch + verify. Best-effort on CI: hosted runner
      # images are not guaranteed to ship a simulator runtime this Xcode can
      # boot, so ONLY this emulator-stage step is continue-on-error — the
      # build above is real and always gates the pipeline. When a simulator
      # is available this step must be green too; a red here with green
      # build is reported, not hidden (the verdict file + logs are uploaded
      # either way for diagnosis).
      - name: Run m1.spike.boot + m1.carrier.loopback on simulator and verify
        id: spike-run
        continue-on-error: true
        run: |
          set -euo pipefail
          ART=hosts/ios/artifacts/m1-spike
          ART2=hosts/ios/artifacts/m1-carrier
          mkdir -p "$ART" "$ART2"
          # Match any iPhone device line regardless of name suffix ("iPhone 16",
          # "dsh-iphone", …) — the literal 'iPhone (' never occurs in stock
          # runner device names, which silently disabled this stage.
          UDID=$(xcrun simctl list devices available \
            | grep -iE 'iphone' \
            | grep -m1 -oE '[A-F0-9]{8}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{12}' || true)
          [ -n "$UDID" ] || { echo "::warning::no available iPhone simulator on this runner"; exit 1; }
          echo "using simulator $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" hosts/ios/DerivedData/Build/Products/Debug-iphonesimulator/DSHSpike.app
          # simctl launch APPENDS to the capture files; the committed evidence
          # from the local run must go so the checker sees only this run.
          rm -f "$ART/logs.txt" "$ART/nslog-stderr.txt"
          xcrun simctl launch --terminate-running-process \
            --stdout="$PWD/$ART/logs.txt" \
            --stderr="$PWD/$ART/nslog-stderr.txt" \
            "$UDID" org.dsh.DSHSpike
          # One launch drives the two m1 scenarios and then the UI-driven m2
          # leg; wait with a deadline — never a blind sleep. On CI nobody can
          # tap the m2 prompts, so the run stalls at the first `spike:
          # ui-wait` marker; accepting that marker as the stop condition lets
          # the m1 checks still run on the captured m1 lines (all m1 events
          # are complete before the UI-driven leg starts). Locally, via
          # tools/e2e/run-ios.sh, the terminal `spike: sequence` marker
          # appears as before.
          # Stop on the terminal marker, OR once the log has gone QUIET with
          # the app having emitted: measured on CI, `simctl launch` returns and
          # the m1 events are all written, but the terminal marker never comes
          # because the UI-driven m2 leg cannot be tapped. The old marker-only
          # condition then exited 1 before the checkers ran, so real evidence on
          # disk went unverified and every green run carried a red annotation.
          # Idle is asserted (no new bytes for 8 x 2 s), never a blind sleep.
          last=-1; idle=0
          for i in $(seq 1 90); do
            grep -qE "spike: (sequence|ui-wait)" "$ART/logs.txt" 2>/dev/null && break
            now=$(wc -c < "$ART/logs.txt" 2>/dev/null || echo 0)
            if [ "$now" = "$last" ] && [ "$now" -gt 0 ]; then
              idle=$((idle + 1))
              [ "$idle" -ge 8 ] && break
            else
              idle=0
            fi
            last="$now"
            sleep 2
          done
          # The only thing worth failing on is "the app produced nothing".
          grep -q '^dsh.spike.log:' "$ART/logs.txt" \
            || { echo "::error::no dsh.spike.log lines — the app never ran"; exit 1; }
          grep -q "spike: sequence" "$ART/logs.txt" \
            || echo "::warning::terminal marker absent (the UI-driven m2 leg cannot be driven on CI) — verifying the completed m1 scenarios only"
          if grep -q "spike: ui-wait" "$ART/logs.txt" && ! grep -q "spike: sequence" "$ART/logs.txt"; then
            echo "::warning::run stalled at a UI-driven m2 prompt (no UI driver on CI) — verifying the completed m1 scenarios only"
          fi
          xcrun simctl io "$UDID" screenshot "$ART2/screenshot.png" || true
          grep '^dsh.spike.log:' "$ART/logs.txt" > "$ART/scenario.jsonl"
          cp "$ART/scenario.jsonl" "$ART2/scenario.jsonl"
          node tools/e2e/check.mjs \
            --manifest tools/e2e/scenarios/m1-spike-boot.json \
            --log "$ART/logs.txt" \
            --out "$ART/verdict.json"
          node tools/e2e/check.mjs \
            --manifest tools/e2e/scenarios/m1-carrier-loopback.json \
            --log "$ART/logs.txt" \
            --out "$ART2/verdict.json"

      # M2 gateway-binding E2E + audit-stream check. HONEST: this scenario is
      # UI-driven (permission alert, Files picker, approval dialog,
      # notification banner — see tools/e2e/run-ios.sh) and hosted CI runners
      # have no idb/UI driver, so the terminal `spike: sequence
      # gateway=<verdict>` marker never appears here: this step warns and
      # exits 1, absorbed by continue-on-error. The build above is the hard
      # gate; the full m2 E2E runs locally via tools/e2e/run-ios.sh.
      - name: Check m2.gateway.binding + audit stream (needs UI driver; watchdogs on CI)
        id: m2-run
        continue-on-error: true
        run: |
          set -euo pipefail
          ART=hosts/ios/artifacts/m2-gateway
          mkdir -p "$ART"
          LOG=hosts/ios/artifacts/m1-spike/logs.txt   # one launch drives m1+m1+m2
          for i in $(seq 1 30); do
            grep -q "spike: sequence gateway=" "$LOG" 2>/dev/null && break
            sleep 2
          done
          if ! grep -q "spike: sequence gateway=" "$LOG"; then
            # Warn, do not exit 1. This step cannot succeed on hosted CI by
            # construction (no idb/UI driver), so `exit 1` here carried no
            # signal — continue-on-error absorbed it — while GitHub painted it
            # as a red error on every green run, which is how a pipeline
            # teaches people to ignore red. The absence is the expected
            # outcome and the log is uploaded either way.
            echo "::warning::m2 terminal marker never appeared — expected on CI (no UI driver). Full E2E: tools/e2e/run-ios.sh"
          fi
          grep '^dsh.gateway.audit:' "$LOG" > "$ART/gateway-audit.jsonl"
          node tools/e2e/check.mjs \
            --manifest tools/e2e/scenarios/m2-gateway-binding.json \
            --log "$LOG" \
            --out "$ART/verdict.json"
          node tools/e2e/check.mjs \
            --manifest tools/e2e/scenarios/m2-gateway-audit.json \
            --log "$LOG" \
            --out "$ART/verdict-audit.json"

      - name: Report verdict
        if: always()
        run: |
          for f in \
            hosts/ios/artifacts/m1-spike/verdict.json \
            hosts/ios/artifacts/m1-carrier/verdict.json \
            hosts/ios/artifacts/m2-gateway/verdict.json \
            hosts/ios/artifacts/m2-gateway/verdict-audit.json; do
            if [ -f "$f" ]; then
              cat "$f" | tee -a "$GITHUB_STEP_SUMMARY"
            elif [ "$(dirname "$f")" = "hosts/ios/artifacts/m2-gateway" ]; then
              echo "m2-gateway: no verdict for $(basename "$f") (UI-driven leg cannot complete on CI; run tools/e2e/run-ios.sh locally)" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "$(dirname "$f" | xargs basename): no verdict (simulator stage unavailable on this runner)" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-spike-ios
          path: |
            hosts/ios/artifacts/m1-spike/
            hosts/ios/artifacts/m1-carrier/
            hosts/ios/artifacts/m2-gateway/
          if-no-files-found: warn
