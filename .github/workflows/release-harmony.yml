name: release/harmony
# The HarmonyOS PACKAGE stage of the release pipeline: build the user-facing
# HarmonyOS build and attach it to the release (docs/release.md is the user
# guide).
#
# One workflow per host, so the Actions list names the stage a run belongs to —
# release/ios, release/android, release/harmony — the way dev/ios, dev/android
# and dev/harmonyos already do. The stage that PREPARES the release (the
# version stream) is release/version.
#
# DEFAULT DISPATCH — the USER-FACING build. A distribution build is what a user
# gets: no E2E machinery, no per-event log stream, warn/error only (AGENTS.md
# constraint 5 / rules.md rule L4):
#   dsh-harmony — unsigned Release HAP (sign to install)
#
# `include_harness: true` additionally builds the HARNESS artifact — the E2E
# verification vehicle (debug configuration, full structured logging, the
# verification drives run). It exists for hand-testing on physical devices; the
# dev/harmonyos pipeline already builds and runs the debug harness on every
# push, so this is opt-in:
#   dsh-harmony-harness — unsigned debug HAP
#
# One job, BOTH configurations inside it: the HarmonyOS command-line tools are
# cached once and the expensive CLT download is not paid for twice. Build
# commands mirror dev/harmonyos (they are the proven recipes); every build step
# runs under `set -euo pipefail` so a piped tail or a stale output file can
# never mask a red hvigor exit code.
#
# TWO TRIGGERS, one build path:
#
#   push: tags v*       — a release. The user-facing package builds and is
#                         ATTACHED as an asset of that tag's GitHub Release
#                         (created here if the tag has none), so a tag is a
#                         downloadable build set and not just a diff.
#   workflow_dispatch   — manual packaging, when a human asks for a run that is
#                         not tied to a release. Artifacts land on the run.
#
# A release run never builds the harness package: it is a verification vehicle
# (above), and the `inputs` context is empty outside a dispatch, so the harness
# steps are guarded explicitly rather than by that accident.

on:
  # THE RELEASE TRIGGER IS THE TAG PUSH (D12). Pushing `vX.Y.Z` is what builds
  # and publishes this host's package — deliberately NOT the `release:
  # published` event, because that event is produced by release-please, and
  # cutting a release should not depend on the bot completing. It is also not
  # both triggers: this workflow CREATES the Release when the tag has none, and
  # listening to `release: published` would then fire a second build of the
  # same tag.
  #
  # `git push origin vX.Y.Z` fires this. A tag created through the Releases UI
  # is not a `git push`, so it is not relied on — push the tag.
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      include_harness:
        description: >-
          Also build the E2E harness package (debug configuration, full logs,
          verification drives). Off by default — the dev/harmonyos pipeline
          covers the debug harness on every push.
        type: boolean
        default: false
      release_tag:
        description: >-
          Attach the built package to this existing release tag (e.g. v0.0.1),
          REPLACING that tag's asset in place — the recovery path for a release
          whose asset was built wrong, without deleting and re-publishing the
          release. Leave empty for a plain manual run, whose package stays on
          the workflow run only.
        type: string
        required: false
        default: ''
  # `release: published` is deliberately NOT a trigger: this workflow CREATEs
  # the Release when a tag has none, so listening to that event would fire a
  # second build of the same tag. The tag push is the one trigger.

# `gh release upload` writes the asset onto the published release.
permissions:
  contents: write

# Queued, never cancelled. Three hosts build one tag and each ends in
# `gh release upload --clobber`; cancelling mid-upload would leave whichever
# finished last, and a re-dispatch for the same tag must not race the run it is
# repairing. A queued run is cheap; a half-uploaded release is not.
concurrency:
  group: release-harmony-${{ github.ref }}
  cancel-in-progress: false

jobs:
  harmony-package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DEVECO_SDK_HOME: ${{ github.workspace }}/clt/command-line-tools/sdk
      # Empty on a plain dispatch (the package stays on the run); the release
      # tag otherwise — the event's own tag, or the one a dispatch asked for.
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify the tag agrees with every version file
        # The tag is the human's decision (D12); this is what keeps that from
        # becoming a mislabelled build. Skipped on a plain dispatch with no
        # release_tag, where nothing is attached to anything.
        if: env.RELEASE_TAG != ''
        run: sh tools/release/check-tag-version.sh "$RELEASE_TAG"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache the unpacked HarmonyOS CLT
        id: clt-cache
        uses: actions/cache@v4
        with:
          path: clt
          key: hos-clt-linux-unpacked-26.0.0.821

      - name: Install HarmonyOS CLT (Linux, cache miss only)
        if: steps.clt-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          URL="${{ vars.HOS_CLT_LINUX_URL }}"
          if [ -z "$URL" ]; then
            echo "::error::Repository variable HOS_CLT_LINUX_URL is not set — cannot build the HAP (set it to the signed Linux CLT zip link from the Huawei download page)"
            exit 1
          fi
          for attempt in 1 2 3; do
            echo "download attempt $attempt..."
            curl -sS -L --retry 3 --retry-delay 5 -o /tmp/clt.zip "$URL" || true
            unzip -tq /tmp/clt.zip > /dev/null 2>&1 && break
            sleep 5
          done
          unzip -tq /tmp/clt.zip > /dev/null || { echo "::error::CLT zip corrupt/missing after retries"; exit 1; }
          unzip -q /tmp/clt.zip -d "$GITHUB_WORKSPACE/clt"
          chmod -R u+w "$GITHUB_WORKSPACE/clt"

      - name: Vendor quickjs-ng
        run: sh runtime/spike/vendor/ensure.sh

      - name: Install dependencies (ohpm) and build the release HAP (unsigned)
        working-directory: hosts/harmony
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/clt/command-line-tools/bin/ohpm" install --all
          "$GITHUB_WORKSPACE/clt/command-line-tools/bin/hvigorw" assembleHap \
            --mode module -p product=default -p buildMode=release --no-daemon
          test -f entry/build/default/outputs/default/entry-default-unsigned.hap \
            || { echo "::error::release HAP not produced"; exit 1; }
          grep -q 'DSH_RELEASE = true' \
            entry/build/default/generated/profile/default/BuildProfile.ets \
            || { echo "::error::the release HAP did not publish DSH_RELEASE"; exit 1; }

      - name: Assert the release HAP is genuinely release configuration
        # The guard above proves the LOG STRIP and says nothing about the
        # debuggable bit — which is exactly how a debuggable "release" HAP
        # shipped: a product-level `buildOption.debuggable` beat buildMode.
        # This reads the packaged metadata, where the two axes are distinct.
        working-directory: hosts/harmony
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, zipfile
          hap = "entry/build/default/outputs/default/entry-default-unsigned.hap"
          with zipfile.ZipFile(hap) as z:
              app = json.loads(z.read("module.json"))["app"]
          debug, mode = app.get("debug"), app.get("buildMode")
          if debug is not False or mode != "release":
              raise SystemExit(
                  "::error::release HAP is not release configuration "
                  f"(debug={debug!r}, buildMode={mode!r})")
          print(f"release HAP: debug={debug} buildMode={mode}")
          PY

      - name: Upload dsh-harmony
        uses: actions/upload-artifact@v4
        with:
          name: dsh-harmony
          path: hosts/harmony/entry/build/default/outputs/default/entry-default-unsigned.hap
          if-no-files-found: error

      - name: Attach dsh-harmony to the release
        # Runs BEFORE the harness build below, which overwrites this same
        # output path (both modes write entry-default-unsigned.hap).
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cp hosts/harmony/entry/build/default/outputs/default/entry-default-unsigned.hap \
            /tmp/dsh-harmony.hap
          # The tag may exist with no Release object yet — pushing the tag is
          # the trigger now, so "publish the Release" is this step's job. Three
          # hosts run concurrently against one tag, so a lost create race is
          # tolerated rather than reported as a failure.
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag \
              --title "$RELEASE_TAG" --generate-notes \
              || gh release view "$RELEASE_TAG" > /dev/null 2>&1
          fi
          gh release upload "$RELEASE_TAG" /tmp/dsh-harmony.hap --clobber

      - name: Build the harness HAP (debug, unsigned)
        # Same output path as the release HAP (both modes write
        # entry-default-unsigned.hap), so copy it out before anything else.
        if: github.event_name == 'workflow_dispatch' && inputs.include_harness
        working-directory: hosts/harmony
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/clt/command-line-tools/bin/hvigorw" assembleHap \
            --mode module -p product=default -p buildMode=debug --no-daemon
          test -f entry/build/default/outputs/default/entry-default-unsigned.hap \
            || { echo "::error::harness HAP not produced"; exit 1; }
          cp entry/build/default/outputs/default/entry-default-unsigned.hap \
            /tmp/entry-default-debug-unsigned.hap

      - name: Upload dsh-harmony-harness
        if: github.event_name == 'workflow_dispatch' && inputs.include_harness
        uses: actions/upload-artifact@v4
        with:
          name: dsh-harmony-harness
          path: /tmp/entry-default-debug-unsigned.hap
          if-no-files-found: error
